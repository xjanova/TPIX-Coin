# TPIX — ด่านยืนยันซอร์สสัญญา (คู่กับ /etc/nginx/conf.d/08-tpix-verify-gate.conf)
# include ในบล็อก server 443 ของ explorer.tpix.online ก่อน location /api/
# verify ทำได้ทางเดียว: TPIX Token Factory (tpix.online) ส่ง X-TPIX-Verify-Key หลังรับค่าธรรมเนียม 1,000 TPIX

# nginx resolves dot-segments for location matching but proxies the raw path, which
# Phoenix routes without resolving them - reject them so both sides see the same path.
if ($request_uri ~* "^[^?#]*(/|%2f)(\.|%2e){1,2}(/|%2f|\?|#|$)") {
    return 400;
}

location ~ ^/api/v2/smart-contracts/[^/]+/verification/ {
    default_type application/json;
    if ($tpix_verify_v2_block) {
        return 403 '{"message":"Contract source verification on TPIX Explorer is available only through TPIX Token Factory (tpix.online)."}';
    }
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TPIX-Verify-Key "";
}

# API v1 verification endpoint (VerifiedSmartContractController) - writes need the key
location ~ ^/api/v1/verified_smart_contracts {
    default_type application/json;
    if ($tpix_verify_v2_block) {
        return 403 '{"message":"Contract source verification on TPIX Explorer is available only through TPIX Token Factory (tpix.online)."}';
    }
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TPIX-Verify-Key "";
}

# legacy etherscan-style RPC: Phoenix serves it at /api/, /api/v1 and /api/v1/
location ~ ^/api/(v1/?)?$ {
    default_type application/json;
    if ($tpix_verify_legacy_block) {
        return 403 '{"status":"0","message":"Contract source verification on TPIX Explorer is available only through TPIX Token Factory (tpix.online).","result":null}';
    }
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TPIX-Verify-Key "";
}

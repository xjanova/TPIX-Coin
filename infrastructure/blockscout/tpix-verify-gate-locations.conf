# TPIX — ด่านยืนยันซอร์สสัญญา (คู่กับ /etc/nginx/conf.d/15-tpix-verify-gate.conf)
# include ในบล็อก server 443 ของ explorer.tpix.online ก่อน location /api/

location ~ ^/api/v2/smart-contracts/[^/]+/verification/ {
    default_type application/json;
    if ($tpix_verify_v2_block) {
        return 403 '{"message":"Contract source verification on TPIX Explorer is available only through TPIX Token Factory (tpix.online)."}';
    }
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TPIX-Verify-Key "";
}

location = /api/ {
    default_type application/json;
    if ($tpix_verify_legacy_block) {
        return 403 '{"status":"0","message":"Contract source verification on TPIX Explorer is available only through TPIX Token Factory (tpix.online).","result":null}';
    }
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-TPIX-Verify-Key "";
}

# TPIX - gate public contract source verification on explorer.tpix.online
# Verification is a paid Token Factory service (1,000 TPIX); tpix.online sends
# X-TPIX-Verify-Key only after the on-chain fee is confirmed (BLOCKSCOUT_VERIFY_KEY).
# Key file: /etc/nginx/tpix-verify-key.map (root 600), one line: "<key>" 1;
# Locations: /etc/nginx/snippets/tpix-verify-gate-locations.conf (explorer 443 block)

# 64-char key exceeds the default bucket (64) -> "could not build map_hash".
# Must be set before the first map in http{} (10-tpix-http.conf), hence the 08- prefix.
map_hash_bucket_size 128;

map $http_x_tpix_verify_key $tpix_verify_keyok {
    default 0;
    ""      0;
    include /etc/nginx/tpix-verify-key.map;
}

# /api/v2/smart-contracts/<addr>/verification/... - writes need the key (GET status stays open)
map "$request_method:$tpix_verify_keyok" $tpix_verify_v2_block {
    default                       0;
    "~^(POST|PUT|PATCH|DELETE):0$" 1;
}

# /api/ etherscan-style: body is not visible to map -> block every POST on /api/
# (reads are GET) plus GET with action=verify* (checkverifystatus still works)
map "$request_method:$arg_action:$tpix_verify_keyok" $tpix_verify_legacy_block {
    default         0;
    "~:1$"          0;
    "~^POST:"       1;
    "~*^[A-Z]+:verify" 1;
}

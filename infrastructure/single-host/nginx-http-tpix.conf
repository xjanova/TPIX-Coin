# ══════════════════════════════════════════════════════════════════════════════
#  TPIX RPC — ส่วนที่ต้องอยู่ใน http {} context
#  ต้นฉบับของ /etc/nginx/conf.d/10-tpix-http.conf
#
#  ทุกอย่างที่ vhost (sites-available/tpix-rpc.conf) เรียกใช้ ถูกประกาศไว้ที่นี่
#  ที่เดียว — โซน, log_format, real-IP, upstream, js_import
#  แยกกันเมื่อไหร่ regex ของ fail2ban กับ log_format จริงจะเลื่อนออกจากกันเงียบ ๆ
#  แล้ว jail จะแบนใครไม่ได้เลยโดยไม่มีอะไรฟ้อง (เกิดมาแล้วจริง ๆ — ดูหัวข้อ log ล่าง)
# ══════════════════════════════════════════════════════════════════════════════

# ── njs ───────────────────────────────────────────────────────────────────────
# ต้องมี libnginx-mod-http-js (njs ≥ 0.8.0 เพราะใช้ js_shared_dict_zone)
#   dpkg -l | grep libnginx-mod-http-js
#   nginx -V 2>&1 | tr ' ' '\n' | grep -i njs
js_import tpix from /etc/nginx/njs/tpix-rpc.js;

# ถังโควตา "เขียน" ต่อ IP — timeout ต้องเท่ากับ WINDOW_SECONDS ใน tpix-rpc.js
# evict = ถ้าโซนเต็มให้ทิ้งคีย์เก่าทิ้ง แทนที่จะเริ่มปฏิเสธผู้ใช้จริง
# 1m ≈ รองรับ IP ที่กำลังส่งธุรกรรมพร้อมกันได้หลายพัน ซึ่งเกินพอ
#
# ⛔ ห้ามลืม type=number — ค่าปริยายของ js_shared_dict_zone คือ string dict
#    ซึ่ง .incr() ใช้ไม่ได้ อาการคือ **ธุรกรรมทุกใบได้ 500** (แย่กว่าไม่มีด่าน)
#    และ nginx -t ผ่านฉลุย ไปโผล่เป็น js exception ใน error log เท่านั้น:
#      "TypeError: shared dict is not a number dict"
#    เจอจริงบน production 2026-08-28
#
# ⛔ เปลี่ยนชนิดของโซนแล้ว **reload ไม่พอ ต้อง restart** — โซนหน่วยความจำร่วม
#    อยู่ข้ามรอบ reload nginx จะปฏิเสธด้วย
#      [emerg] js_shared_dict_zone "rpc_write_budget" had previously a different type
#    ที่อันตรายคือ `systemctl reload nginx` **คืนค่าสำเร็จ** ทั้งที่ config ใหม่ถูกปฏิเสธ
#    ตัวเก่ายังวิ่งต่อเงียบ ๆ → ต้องอ่าน error log ยืนยันเสมอ อย่าเชื่อ exit code
js_shared_dict_zone zone=rpc_write_budget:1m timeout=10s type=number evict;

# ── ที่อยู่ผู้ใช้จริงหลัง Cloudflare ────────────────────────────────────────────
# ⚠️ ข้อนี้เป็น "เงื่อนไขก่อน" ของทุกอย่างข้างล่าง ถ้าไม่เปิด:
#      $remote_addr = IP ของ Cloudflare edge สำหรับผู้ใช้ทุกคน
#      → limit_req 30r/s กลายเป็นโควตารวมของคนทั้งโลก ผู้ใช้จริงล็อกกันเอง
#      → fail2ban ignoreip ที่ใส่ช่วง CF ไว้ = ไม่มีวันแบนใครที่มาทาง CF
#      → โควตาเขียนใน njs ก็ผิดฝั่งเหมือนกัน
#
# และ header นี้เชื่อได้ก็ต่อเมื่อ **ปิดทางยิงตรงเข้า origin แล้ว** เท่านั้น
#      → ต้องรัน scripts/allow-cloudflare-only.sh ก่อน
#      (พิสูจน์แล้ว 2026-08-27 ว่ายิงตรง origin ได้จริง ตอบ 200 พร้อมเลขบล็อก)
#
# รายการช่วง IP อัปเดตด้วย: scripts/allow-cloudflare-only.sh --print-nginx
# ที่มา https://www.cloudflare.com/ips/ (ชุดนี้ตรงกับที่ใช้ใน fail2ban/jail.d/tpix-rpc.conf)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ── โซนจำกัดอัตรา ─────────────────────────────────────────────────────────────
# ชั้นหยาบ ใช้ได้โดยไม่ต้องอ่าน body — กันคนยิงรัวทุกชนิดรวมกัน
# ชั้นละเอียด (แยกอ่าน/เขียน) อยู่ใน njs เพราะต้องดู method ซึ่งอยู่ใน body
limit_req_zone  $binary_remote_addr zone=rpc_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=rpc_conn_per_ip:10m;

# ── log สำหรับ fail2ban ───────────────────────────────────────────────────────
# ⚠️ ต้องคู่กับ fail2ban/filter.d/tpix-rpc.conf และ jail logpath เสมอ
#    ของเดิม vhost เขียนลง /var/log/nginx/tpix-dbg.log ด้วยฟอร์แมตกำหนดเอง
#    แต่ jail ไปเฝ้า /var/log/nginx/access.log ด้วย failregex ของฟอร์แมต combined
#    → คนละไฟล์ คนละฟอร์แมต = jail ไม่เคยแบนใครได้เลย และไม่มีอะไรบอก
#
# ฟอร์แมตนี้ = combined มาตรฐาน + 2 ช่องท้าย (cf= กับ rt=) ซึ่งไม่กระทบ failregex
# ที่ยึดกับส่วนหัว เอา $remote_addr ขึ้นต้นเพื่อให้ <HOST> ของ fail2ban จับได้ตรง ๆ
log_format tpixgate '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cf=$http_cf_connecting_ip rt=$request_time';

# ── รายชื่อ IP ที่ถูกแบน (fail2ban เติมให้) ──────────────────────────────────────
geo $banned_ip {
    default 0;
    # 0 = ผ่าน, 1 = บล็อก
    # fail2ban jail tpix-rpc เติมบรรทัดลงที่นี่ผ่าน action
    include /etc/nginx/conf.d/tpix-banned.map;
}

# ── ล็อกให้ทราฟฟิกมาจาก Cloudflare เท่านั้น (เข็มขัดเส้นที่สอง) ─────────────────
# เส้นแรกคือไฟร์วอลล์ (allow-cloudflare-only.sh) ซึ่ง fail-closed ที่ชั้น network
# ตัวนี้ไว้กันกรณีกฎไฟร์วอลล์ถูกล้างโดยไม่ตั้งใจ (docker เขียนทับ iptables ได้)
#
# วิธีเปิดใช้:
#   1. openssl rand -hex 32
#   2. Cloudflare → Rules → Transform Rules → Modify Request Header
#        Set static: X-CF-Origin-Token = <token>  (ครอบ rpc.tpix.online ทุก path)
#   3. เปลี่ยน default เป็น 0 แล้วเปิดคอมเมนต์บรรทัด token
#   4. nginx -t && systemctl reload nginx
#   5. ทดสอบ: ยิงตรง origin ต้องได้ 403 · ผ่าน rpc.tpix.online ต้องได้ 200
map $http_x_cf_origin_token $origin_ok {
    default 1;                     # ← เปลี่ยนเป็น 0 เมื่อตั้ง Transform Rule แล้ว
    # "PASTE_TOKEN_HERE"    1;     # ← เปิดคอมเมนต์พร้อมกันกับบรรทัดบน
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── upstream ─────────────────────────────────────────────────────────────────
upstream tpix_rpc {
    least_conn;
    # ⚠️ ทั้ง 4 ตัวนี้เป็น validator ที่ถือคีย์และ --seal อยู่
    #    ทราฟฟิกสาธารณะไม่ควรเข้าโหนดที่ผลิตบล็อก — ควรมีโหนด RPC ที่ไม่มี --seal
    #    แยกออกมาแล้วชี้มาที่ตัวนั้นแทน (ดู REGENESIS-RUNBOOK Phase 5)
    server tpix-validator-1:8545 max_fails=2 fail_timeout=10s;
    server tpix-validator-2:8545 max_fails=2 fail_timeout=10s;
    server tpix-validator-3:8545 max_fails=2 fail_timeout=10s;
    server tpix-validator-4:8545 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

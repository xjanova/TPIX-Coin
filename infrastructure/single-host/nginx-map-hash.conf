# TPIX - map hash bucket size for every map in http{}
# Installed as /etc/nginx/conf.d/01-tpix-map-hash.conf (must sort before every file that declares a map)
#
# nginx fixes map_hash_bucket_size when it parses the FIRST map block in http{}.
# A map_hash_bucket_size directive after that point fails `nginx -t`:
#   [emerg] "map_hash_bucket_size" directive is duplicate
#
# The 64-char verify key in 08-tpix-verify-gate.conf needs 128 (the default 64 gives
# "could not build map_hash"). Until 2026-11-20 the directive lived in that file, which
# worked only while no earlier file declared a map. 05-tpix-njs.conf declares one now
# ($rpc_client_net), so installing it on the chain host failed `nginx -t` with the
# error above. The lab did not catch it: it has no 08-tpix-verify-gate.conf.
#
# Keep this the only place that sets the value, and keep its name sorting first.
map_hash_bucket_size 128;

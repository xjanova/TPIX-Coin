# TPIX Chain Explorer — Nginx reverse proxy (โฮสต์ nginx หน้า Blockscout)
#
# ไฟล์นี้คือต้นฉบับของ /etc/nginx/sites-available/tpix-explorer.conf บนเซิร์ฟเวอร์
# แก้ที่นี่ commit แล้วค่อยส่งขึ้น (nginx -t ก่อน reload เสมอ)
#
# ส่วนเสริมหน้าเว็บ (โลโก้ · การ์ดกระเป๋าคลัง · ลบเครดิต Blockscout)
# อยู่ที่ /opt/tpix/www/tpix-explorer.js — ที่นี่แทรกแค่แท็ก <script> ก่อน </head>
#
# ของเดิมย่อ JS ทั้งไฟล์มาฝังเป็นสตริงเดียวใน sub_filter บรรทัดนี้ ผลคือ
#   - แก้โค้ดหน้าเว็บทีต้องไปแก้ config ของ nginx
#   - มี JS สองสำเนา (custom-head.html กับใน conf นี้) ที่เพี้ยนจากกันได้
#   - เบราว์เซอร์แคชไม่ได้ ต้องส่งซ้ำทุกหน้า
#
# ต้นทาง JS: infrastructure/blockscout/tpix-explorer.js ใน repo

server {
    listen 80;
    server_name explorer.tpix.online;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name explorer.tpix.online;

    # SSL — adjust paths to your cert
    ssl_certificate     /etc/ssl/tpix/temp.crt;
    ssl_certificate_key /etc/ssl/tpix/temp.key;

    # Proxy to Blockscout frontend
    location = /tpix-explorer.js {
        alias /opt/tpix/www/tpix-explorer.js;
        add_header Cache-Control "public, max-age=300";
        default_type application/javascript;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub_filter แทนที่ได้เฉพาะข้อความล้วน — ถ้า upstream ส่ง gzip มา
        # มันจะไม่แทนที่อะไรเลยโดยไม่มี error ให้เห็น branding จะหายเงียบๆ
        proxy_set_header Accept-Encoding "";

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ─── Inject Custom Branding ───────────────────
        # Requires: nginx compiled with ngx_http_sub_module
        # (default in most distributions)
        sub_filter_once on;
        # แทรกแค่แท็ก <script> — ตัวโค้ดอยู่ที่ /opt/tpix/www/tpix-explorer.js
        # ของเดิมย่อ JS ทั้งก้อนมาฝังเป็นสตริงเดียวตรงนี้ ทำให้แก้โค้ดต้องแก้
        # config เว็บเซิร์ฟเวอร์ และเบราว์เซอร์แคชไม่ได้เลย
        sub_filter '</head>' '<script defer src="/tpix-explorer.js?v=3"></script></head>';
    }

    # WebSocket ของ Phoenix — ถ้าไม่มีเส้นนี้ หน้าแรกจะไม่อัปเดตบล็อกสด
    location /socket/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── บริการสถิติ (หน้า /stats) ────────────────────────────────────────────
    # วางไว้บนโดเมนเดิมเป็น path แทนการทำ subdomain — เลี่ยงงาน DNS + ใบรับรอง
    # และเป็น same-origin ให้เบราว์เซอร์ จึงไม่ต้องตั้ง CORS อะไรเลย
    # ต้องคู่กับ NEXT_PUBLIC_STATS_API_BASE_PATH=/stats-api ฝั่ง frontend
    #
    # ⚠️ ต้องมี / ท้าย proxy_pass — ไม่งั้น nginx ส่ง /stats-api/api/v1/... ไปทั้งดุ้น
    # แล้ว stats จะตอบ 404 ทุกเส้น (มี / = ตัด /stats-api/ ออกให้)
    location /stats-api/ {
        proxy_pass http://127.0.0.1:8153/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy to Blockscout backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

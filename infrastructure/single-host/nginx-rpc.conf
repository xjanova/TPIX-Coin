# TPIX JSON-RPC edge — โฮสต์ nginx หน้า validator 4 ตัวบน loopback
#
# ไฟล์นี้คือต้นฉบับของ /etc/nginx/sites-available/tpix-rpc.conf
# ส่วนที่อยู่ใน http {} (โซน · log_format · real-IP · upstream · js_import)
# อยู่ที่ nginx-http-tpix.conf → /etc/nginx/conf.d/10-tpix-http.conf
#
# แก้ที่นี่ commit แล้วค่อยส่งขึ้น · ก่อน reload ทุกครั้ง:
#   sudo nginx -t && sudo bash scripts/verify-rpc-gate.sh
#
# ══════════════════════════════════════════════════════════════════════════════
#  เปลี่ยนจากรุ่นก่อนหน้า: ตัวกรองย้ายจาก map+if มาเป็น njs
#
#  map ทั้งสามตัวเดิมอ่าน $request_body ใน rewrite phase ซึ่งยังว่างเปล่า
#  (nginx อ่าน body ใน content phase) → allow-list ไม่มีวันแมตช์ → 403 ทุกคำขอ
#  จึงถูกคอมเมนต์ทิ้งไปเมื่อ 2026-08-06 = ตั้งแต่นั้นมาไม่มีด่านเมธอดเลย
#  (ยืนยัน 2026-08-27: txpool_status ยิงผ่าน rpc.tpix.online ได้ 200)
#
#  js_content ทำงานใน content phase — nginx อ่าน body เสร็จก่อนเรียก handler
#  จึงตัดสินจากเนื้อคำขอได้จริง และแยก "อ่าน" ออกจาก "เขียน" ได้
#  ซึ่งเป็นด่านเดียวที่กันการยิงถล่ม mempool บนเชนค่าแก๊ส 0 ได้
#  ตรรกะ + เทสต์: infrastructure/njs/tpix-rpc.js · tpix-rpc.test.mjs
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name rpc1.tpix.online rpc.tpix.online;

    # ต้องมาก่อน redirect ไม่งั้นการต่ออายุใบรับรองจะเงียบตายในอีก 3 เดือน
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc1.tpix.online rpc.tpix.online;

    ssl_certificate     /etc/ssl/tpix/temp.crt;
    ssl_certificate_key /etc/ssl/tpix/temp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TPIXSSL:10m;

    # ⚠️ สามค่านี้ต้องไปด้วยกัน — njs อ่าน r.requestText ได้เฉพาะเมื่อ body
    #    อยู่ในหน่วยความจำ ถ้า body ใหญ่กว่า buffer nginx จะเทลงไฟล์ชั่วคราว
    #    แล้ว requestText จะว่าง (ตัวกรองจะตอบ 413 พร้อมบอกสาเหตุ ไม่ใช่ 403 ลอย ๆ)
    client_max_body_size         32k;
    client_body_buffer_size      32k;
    client_body_in_single_buffer on;
    client_body_timeout          10s;
    client_header_timeout        10s;

    # ชั้นหยาบ — นับทุกคำขอรวมกัน ทำงานได้โดยไม่ต้องอ่าน body
    # ชั้นละเอียดที่แยกโควตาเขียนอยู่ใน njs (ต้องดู method ซึ่งอยู่ใน body)
    limit_req  zone=rpc_per_ip burst=60 nodelay;
    limit_req_status 429;
    limit_conn rpc_conn_per_ip 10;
    limit_conn_status 429;

    # ⚠️ ต้องเป็นไฟล์เดียวกับ logpath ใน fail2ban/jail.d/tpix-rpc.conf
    #    และ tpixgate ต้องเป็นฟอร์แมตที่ filter.d/tpix-rpc.conf ถอดได้
    #    ของเดิมเขียนลง tpix-dbg.log แต่ jail เฝ้า access.log = ไม่เคยแบนใครเลย
    access_log /var/log/nginx/tpix-rpc.access.log tpixgate;
    error_log  /var/log/nginx/tpix-rpc.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    if ($banned_ip)     { return 403; }
    if ($origin_ok = 0) { return 403; }

    # ต้องอยู่นอก location / ไม่งั้นด่าน POST-only จะกิน probe แบบ GET ไปด้วย
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ── ด่านจริง ──────────────────────────────────────────────────────────────
    # njs แกะ JSON แล้วตัดสิน: deny-list → allow-list → โควตาเขียนต่อ IP
    # ผ่านแล้วค่อย subrequest ไป /__rpc_upstream
    location / {
        js_content tpix.gate;
    }

    # ── ปลายทางจริง — เข้าถึงได้จาก subrequest ของ njs เท่านั้น ─────────────────
    location = /__rpc_upstream {
        internal;
        access_log off;          # คำขอหลักถูกบันทึกไปแล้ว ไม่ต้องซ้ำ

        proxy_pass http://tpix_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # ⚠️ ต้องซ่อนของ upstream ก่อน — polygon-edge ใส่
        #    `Access-Control-Allow-Origin: *` มาเองทุก response
        #    ถ้าไม่ซ่อน เบราว์เซอร์จะเห็นสองค่า ("*, https://explorer.tpix.online")
        #    ซึ่งผิดสเปกแล้วบล็อกทั้ง request โดย server ตอบ 200 ปกติ
        #    เจอจริง 2026-08-08: การ์ดกระเป๋าคลังบน explorer อ่านยอดไม่ได้ทั้ง 6 ใบ
        #    (curl ไม่เจอ เพราะ CORS เป็นกฎของเบราว์เซอร์ ไม่ใช่ของ HTTP)
        #    ตัว njs เป็นคนเติม CORS ที่ถูกต้องให้ในคำตอบสุดท้าย
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # ── WebSocket ปิดตาย ──────────────────────────────────────────────────────
    # ⛔ ห้ามเปิด location = /ws proxy ตรงไป upstream เด็ดขาด
    #
    # เคยเปิดไว้ 2026-08-28 ด้วยความเข้าใจผิดว่า "WS ส่งได้แต่ subscribe/unsubscribe
    # จึงไม่ใช่ทางหลบโควตาเขียน" — ผิดสิ้นเชิง ทดสอบจริงกับ wss://rpc.tpix.online/ws:
    #
    #   txpool_status                     → ตอบ {"pending":0,"queued":0} ปกติ
    #   eth_sendRawTransaction × 13 ใบ    → ไปถึงตัวถอด RLP ของโหนดครบทั้ง 13 ใบ
    #                                       ไม่โดนตัดสักใบ
    #
    # polygon-edge เปิด JSON-RPC ชุดเต็มบน WebSocket ที่พอร์ตเดียวกัน
    # และ js_content ทำ protocol upgrade ไม่ได้ → WS จึงเลี่ยงทั้ง deny-list
    # allow-list และโควตาเขียน = ด่านทั้งหมดที่สร้างมาไร้ความหมายทันที
    #
    # ตอนนี้ไม่มีอะไรในระบบใช้ WS ของเชนเลย (หน้าเทรดใช้ wss ของ Binance
    # สำหรับกราฟเท่านั้น) ถ้าวันหน้าต้องการ eth_subscribe จริง ๆ ต้องทำเป็น
    # โหนดแยกที่ไม่มี --seal + โควตาของตัวเอง ไม่ใช่เปิด proxy ตรงแบบนี้
    location = /ws {
        return 403 '{"jsonrpc":"2.0","error":{"code":-32600,"message":"websocket disabled"},"id":null}';
        default_type application/json;
    }
}

# TPIX JSON-RPC edge — โฮสต์ nginx หน้า validator 4 ตัวบน loopback
# ด่านกรอง (map/upstream/zone) อยู่ที่ /etc/nginx/conf.d/10-tpix-http.conf
# ซึ่งยกมาจาก infrastructure/nginx-rpc.conf ใน repo ทั้งชุด
#
# ไฟล์นี้คือต้นฉบับของ /etc/nginx/sites-available/tpix-rpc.conf บนเซิร์ฟเวอร์
# แก้ที่นี่ commit แล้วค่อยส่งขึ้น (nginx -t ก่อน reload เสมอ)

server {
    listen 80;
    listen [::]:80;
    server_name rpc1.tpix.online rpc.tpix.online;

    # ต้องมาก่อน redirect ไม่งั้นการต่ออายุใบรับรองจะเงียบตายในอีก 3 เดือน
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc1.tpix.online rpc.tpix.online;

    ssl_certificate     /etc/ssl/tpix/temp.crt;
    ssl_certificate_key /etc/ssl/tpix/temp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TPIXSSL:10m;

    # ต้องคู่กับ client_body_buffer_size — ด่าน allow/deny อ่าน $request_body
    # ซึ่งจะว่างเปล่าทันทีที่ body ใหญ่พอจะถูกเทลงไฟล์ชั่วคราว แล้วทุกอย่างจะโดนปฏิเสธ
    client_max_body_size    32k;
    client_body_buffer_size 32k;
    client_body_timeout     10s;
    client_header_timeout   10s;

    limit_req  zone=rpc_per_ip burst=60 nodelay;
    limit_req_status 429;
    limit_conn rpc_conn_per_ip 10;
    limit_conn_status 429;

    access_log /var/log/nginx/tpix-dbg.log tpixdbg;
    error_log  /var/log/nginx/tpix-rpc.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    if ($banned_ip)                    { return 403; }
    if ($origin_ok = 0)                { return 403; }
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        # ด่านนี้เคยอยู่ระดับ server แล้วไปโดน /health ด้วย → probe แบบ GET พังหมด
        if ($request_method !~ ^(POST|OPTIONS|HEAD)$) { return 405; }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }

        # ── ตัวกรองเมธอดถูกปิดไว้ชั่วคราว 2026-08-06 — อ่านก่อนเปิดกลับ ──────────
        # if ($rpc_method_denied = 1)  { return 403; }
        # if ($rpc_body_escaped = 1)   { return 403; }
        # if ($rpc_method_allowed = 0) { return 403; }
        #
        # สามบรรทัดนี้ "บล็อกทุก request" ไม่ใช่แค่ที่ไม่พึงประสงค์ เพราะ map ทั้งสาม
        # อ่าน $request_body ซึ่ง **ยังว่างเปล่าตอนที่ if ทำงาน**
        #   if  อยู่ใน rewrite phase
        #   nginx อ่าน body ใน content phase (ตอน proxy_pass) ซึ่งมาทีหลัง
        # วัดจริงแล้ว: content_length=63 แต่ $request_body = "-"
        # → allow-list ไม่มีวันแมตช์ → eth_blockNumber ก็ได้ 403
        #
        # จะทำให้ถูกต้องต้องอ่าน body ก่อนตัดสิน ซึ่ง stock nginx ทำไม่ได้ใน if
        # ติดตั้ง libnginx-mod-http-js (njs 0.8.2) ไว้แล้วสำหรับงานนี้
        #
        # ระหว่างที่ปิดอยู่ ด่านที่ยัง "ทำงานจริง" คือ:
        #   rate limit ต่อ IP · จำกัด body 32k · POST/OPTIONS/HEAD เท่านั้น
        #   CF real-IP · geo ban list · origin token gate
        # และ polygon-edge 0.9.0 ไม่เปิด namespace admin/debug/personal/txpool
        # บน JSON-RPC อยู่แล้ว ส่วน gRPC 10000 (ช่องเพิ่ม-ถอด validator) ผูก 127.0.0.1
        # → รูที่ตัวกรองนี้ปิดคือรูของอนาคต ไม่ใช่รูที่เปิดอยู่ตอนนี้

        proxy_pass http://tpix_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # ⚠️ ต้องซ่อนของ upstream ก่อนเติมของเรา — polygon-edge ใส่
        # `Access-Control-Allow-Origin: *` มาเองทุก response ถ้าไม่ซ่อน
        # เบราว์เซอร์จะเห็นสองค่า ("*, https://explorer.tpix.online") ซึ่งผิดสเปก
        # แล้ว **บล็อกทั้ง request** — อาการคือ fetch พังหมดโดย server ตอบ 200 ปกติ
        # เจอจริง 2026-08-08: การ์ดกระเป๋าคลังบน explorer ขึ้น "อ่านยอดไม่ได้" ทั้ง 6 ใบ
        # (curl ไม่เจอปัญหานี้ เพราะ CORS เป็นกฎของเบราว์เซอร์ ไม่ใช่ของ HTTP)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    error_page 400 403 404 405 429 500 502 503 504 = @blocked;
    location @blocked {
        default_type application/json;
        return 403 '{"jsonrpc":"2.0","error":{"code":-32601,"message":"forbidden"},"id":null}';
    }
}

# TPIX Chain — production, single-host (validator 1-4 + Blockscout)
#
# ไฟล์ต้นฉบับ (canonical) — สำเนาที่ใช้จริงอยู่ที่ /opt/tpix/docker-compose.yml
# วิธี apply บนเครื่องที่เชนวิ่งอยู่ (ห้าม down ทั้งวง — เชนจะหยุด):
#   cd ~/TPIX-Coin && git pull
#   sudo cp /opt/tpix/docker-compose.yml /opt/tpix/docker-compose.yml.bak-$(date +%Y%m%d-%H%M%S)
#   sudo cp infrastructure/single-host/docker-compose.yml /opt/tpix/docker-compose.yml
#   sudo bash infrastructure/single-host/apply-rolling.sh
#
# ห้ามเปลี่ยนชื่อ container: genesis.json อ้าง peer ด้วยชื่อผ่าน
# /dns4/tpix-validator-N/tcp/10001/p2p/<id> เปลี่ยนชื่อเมื่อไหร่ โหนดจะสตาร์ทขึ้น
# ดูปกติทุกอย่าง แต่ไม่รวมตัวเป็น mesh และเชนจะค้างที่บล็อก 0 อย่างเงียบๆ
#
# libp2p 10001 ไม่ publish ออกโฮสต์โดยตั้งใจ — validator ทั้ง 4 คุยกันบน docker
# bridge ภายในอยู่แล้ว และ docker แทรกกฎ iptables ก่อน ufw ดังนั้นพอร์ตที่
# publish แบบ 0.0.0.0 จะทะลุไฟร์วอลล์ออกเน็ตทั้งที่ ufw บอก deny
# วันที่แยก validator ออกคนละเครื่องค่อยเปิด แล้วจำกัดด้วย source IP
#
# JSON-RPC/gRPC ผูก 127.0.0.1 เท่านั้น — ทางเข้าสาธารณะคือ nginx บนโฮสต์
# gRPC 10000 คือช่องแอดมิน สั่ง ibft propose เพิ่ม-ถอด validator ได้ ห้ามโผล่เน็ต

name: tpix

x-validator: &validator
  image: 0xpolygon/polygon-edge:0.9.0
  restart: always
  mem_limit: 2g
  environment:
    # กัน GC pause ยาวจนพลาดรอบ propose — ต้นเหตุ stall 2026-04-13 (เชนเก่า)
    # และ 2026-08-08 (เชนนี้): proposer สะดุดครั้งเดียว → IBFT round escalation
    # แบบ exponential backoff → เชนแช่แข็งถาวรจนกว่าจะ restart
    # ค่าตั้งตามสเปกเครื่อง 16 core / 8GB (อย่าลอกค่าเชนเก่าที่เป็นเครื่อง 24 core):
    #   GOGC=50        — GC ถี่ขึ้น heap เล็กลง pause สั้นลง
    #   GOMEMLIMIT     — ต่ำกว่า mem_limit 400MiB กัน OOM kill ก่อน GC ทัน
    #   GOMAXPROCS=4   — 4 validator × 4 = 16 พอดีคอร์ ไม่แย่งกันเอง
    GOGC: "50"
    GOMEMLIMIT: "1600MiB"
    GOMAXPROCS: "4"
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }
  # healthcheck ทุกตัว (เดิมมีแค่ validator-1) — watchdog + rolling apply
  # ใช้สถานะนี้ตัดสินว่าโหนดพร้อมก่อนแตะตัวถัดไป
  healthcheck:
    test: ["CMD-SHELL", "polygon-edge status --grpc-address 127.0.0.1:10000 > /dev/null 2>&1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  networks: [tpix]

# ⚠️ ก่อน apply ทุกครั้ง ต้องยืนยันว่ารุ่นนี้รู้จักธงพวกนี้จริง ใช้เวลา 5 วินาที
#    ธงที่ไม่มีอยู่จริง = validator ไม่บูต = เชนหยุดทั้งวง
#      sudo docker run --rm 0xpolygon/polygon-edge:0.9.0 server --help \
#        | grep -E 'max-enqueued|max-slots|block-gas-target|price-limit'
#
# ── ทำไมตั้งค่าพวกนี้ (เชนค่าแก๊ส 0 กันสแปมด้วยราคาไม่ได้) ───────────────────
# --price-limit 0     คือจุดขายของเชน ห้ามแตะ — แต่แปลว่าไม่มีต้นทุนต่อธุรกรรม
#                     ผู้ใช้จริงจึง **แซงคิวสแปมด้วยการจ่ายแพงกว่าไม่ได้**
#                     ด่านกันสแปมทั้งหมดจึงต้องอยู่นอกเชน (ดู infrastructure/njs/)
#
# --max-enqueued 16   เดิมไม่ได้ตั้ง = ใช้ค่าเริ่มต้น 128 ต่อ address
#                     → 32 address ก็กิน max-slots 4096 จนเต็มแล้ว
#                     ลดเหลือ 16 ต้องใช้ 256 address ถึงจะทำได้เท่าเดิม
#
# --block-gas-target  ลดจาก 20M เหลือ 10M
#                     20M/2วิ = 476 tx/s ซึ่งไม่เคยมีใครใช้ (txpool pending = 0)
#                     แต่มันคือ **เพดานการโตของ state ต่อบล็อก** ด้วย
#                     10M ยังได้ ~238 tx/s (เกินพอ) แต่ครึ่งเดียวของอัตราถมดิสก์
#                     ถ้าวันหน้าทราฟฟิกจริงชนเพดาน ปรับกลับได้ทันที ไม่ใช่ค่าถาวร
#
# --json-rpc-batch-request-limit / --json-rpc-block-range-limit
#                     **ไม่ใส่โดยตั้งใจ** — ยืนยันจาก prod แล้วว่าค่าเริ่มต้นทำงานอยู่
#                     (batch 30 ใบ → "Batch request length too long",
#                      getLogs ทั้งเชน → "block range too high")
#                     ใส่ธงที่รุ่นนี้ไม่รู้จัก = เชนไม่บูต จึงไม่เสี่ยงโดยไม่จำเป็น
x-cmd: &cmd >
  server --data-dir /data --chain /genesis.json
  --grpc-address 0.0.0.0:10000 --libp2p 0.0.0.0:10001 --jsonrpc 0.0.0.0:8545
  --seal --price-limit 0
  --max-slots 4096 --max-enqueued 16
  --block-gas-target 10000000
  --log-level INFO

services:
  tpix-validator-1:
    <<: *validator
    container_name: tpix-validator-1
    command: *cmd
    ports: ["127.0.0.1:8545:8545", "127.0.0.1:10000:10000"]
    volumes:
      - /opt/tpix/chain/data/validator-1:/data
      - /opt/tpix/chain/genesis.json:/genesis.json:ro

  tpix-validator-2:
    <<: *validator
    container_name: tpix-validator-2
    command: *cmd
    ports: ["127.0.0.1:8546:8545", "127.0.0.1:10010:10000"]
    volumes:
      - /opt/tpix/chain/data/validator-2:/data
      - /opt/tpix/chain/genesis.json:/genesis.json:ro

  tpix-validator-3:
    <<: *validator
    container_name: tpix-validator-3
    command: *cmd
    ports: ["127.0.0.1:8547:8545", "127.0.0.1:10020:10000"]
    volumes:
      - /opt/tpix/chain/data/validator-3:/data
      - /opt/tpix/chain/genesis.json:/genesis.json:ro

  tpix-validator-4:
    <<: *validator
    container_name: tpix-validator-4
    command: *cmd
    ports: ["127.0.0.1:8548:8545", "127.0.0.1:10030:10000"]
    volumes:
      - /opt/tpix/chain/data/validator-4:/data
      - /opt/tpix/chain/genesis.json:/genesis.json:ro

  # ── Explorer ────────────────────────────────────────────────────────────────
  # อยู่ compose ไฟล์เดียวกับ validator โดยตั้งใจ: backend ต้องคุยกับ
  # tpix-validator-1:8545 ผ่านชื่อ container ซึ่งใช้ได้เฉพาะเมื่ออยู่ network เดียวกัน
  # และ depends_on service_healthy ข้ามไฟล์ compose ไม่ได้
  blockscout-db:
    image: postgres:16-alpine
    container_name: blockscout-db
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${BS_DB}
      POSTGRES_USER: ${BS_USER}
      POSTGRES_PASSWORD: ${BS_PASS:?BS_PASS หายไปจาก /opt/tpix/.env}
    volumes:
      - blockscout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BS_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks: [tpix]

  blockscout-backend:
    image: blockscout/blockscout:6.10.1
    container_name: blockscout-backend
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      blockscout-db: { condition: service_healthy }
      tpix-validator-1: { condition: service_healthy }
    command: sh -c "bin/blockscout eval 'Elixir.Explorer.ReleaseTasks.create_and_migrate()' && bin/blockscout start"
    volumes:
      # Blockscout ค้นพบ address จาก block/transaction เท่านั้น
      # กระเป๋าที่ได้เงินตั้งแต่ genesis ไม่เคยมีธุรกรรม จึงไม่ถูก index เลย
      # ผล: explorer บอกว่ากระเป๋าคลังไม่มีตัวตน ยอด 0 ทั้งที่ RPC ยืนยันว่ามี 1.4B
      # CHAIN_SPEC_PATH ทำให้มันอ่าน alloc จาก genesis แล้วสร้าง balance ตั้งต้นให้
      # polygon-edge วาง alloc ไว้ใต้คีย์ "genesis" และสะกด chainID (I ใหญ่)
      # Blockscout อ่านสเปกแบบ geth ที่ alloc อยู่ระดับบนสุด ชี้ไฟล์จริงให้มัน
      # จึงหา alloc ไม่เจอ และไม่ error ด้วย — ยอดกระเป๋าคลังหายไปเงียบๆ
      - /opt/tpix/chain/genesis.blockscout.json:/genesis-spec.json:ro
    environment:
      CHAIN_SPEC_PATH: /genesis-spec.json
      MIX_ENV: prod
      DATABASE_URL: postgresql://${BS_USER}:${BS_PASS}@blockscout-db:5432/${BS_DB}
      SECRET_KEY_BASE: ${BS_SECRET_KEY_BASE:?BS_SECRET_KEY_BASE หายไปจาก /opt/tpix/.env}
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: http://tpix-validator-1:8545
      ETHEREUM_JSONRPC_WS_URL: ws://tpix-validator-1:8545/ws
      ETHEREUM_JSONRPC_TRACE_URL: http://tpix-validator-1:8545
      ETHEREUM_JSONRPC_HTTP_TIMEOUT: "30"
      CHAIN_ID: "4289"
      NETWORK: "TPIX Chain"
      SUBNETWORK: "Mainnet"
      COIN: "TPIX"
      COIN_NAME: "Thaiprompt Index"
      BLOCK_TRANSFORMER: base
      PORT: "4000"
      ECTO_USE_SSL: "false"
      API_V2_ENABLED: "true"
      POOL_SIZE: "20"

      # ── บริการเสริม (microservices) ────────────────────────────────────────
      # ยืนยันซอร์สโค้ดสัญญา — ถ้าไม่เปิด หน้า contract จะมีแค่ปุ่มที่กดแล้วพัง
      # และผู้ใช้เห็นแต่ bytecode ตรวจสอบไม่ได้ว่าสัญญาทำอะไร
      MICROSERVICE_SC_VERIFIER_ENABLED: "true"
      MICROSERVICE_SC_VERIFIER_URL: http://blockscout-sc-verifier:8050
      MICROSERVICE_SC_VERIFIER_TYPE: sc_verifier
      #
      # ❌ ไม่เปิด sig-provider — ทดสอบแล้วใช้ไม่ได้จริง (2026-08-08)
      #    image ล่าสุดของ upstream ยังเป็นรุ่น ส.ค. 2024 ที่ฝัง sig.eth.samczsun.com
      #    ไว้เป็นแหล่งข้อมูล ซึ่ง**โดเมนตายไปแล้ว** ผลคือทุก request ค้างรอ DNS 22 วินาที
      #    แล้วค่อยล้มเหลว — หน้าใดที่เรียกมันจะอืดทั้งหน้า
      #    ลองชี้ไป openchain.xyz แทน (เร็วขึ้นเหลือ 1 วิ) แต่คนละรูปแบบ API จึงได้ 404
      #    และแม้บังคับแหล่ง 4byte.directory ตรงๆ ก็ยังคืนค่าว่างสำหรับ 0xa9059cbb
      #    (transfer ซึ่งเป็น selector ที่ดังที่สุด) → ตัวบริการเสียจริง ไม่ใช่ตั้งค่าผิด
      #
      #    ประโยชน์ที่เสียไปมีน้อยมาก: มันช่วยเดาชื่อเมธอดของสัญญาที่**ยังไม่ยืนยันซอร์ส**
      #    เท่านั้น ส่วนสัญญาของ TPIX เองจะถูกยืนยันผ่าน sc-verifier ข้างบนซึ่งให้ ABI
      #    เต็มอยู่แล้ว → ถอดออกดีกว่าเก็บของที่หน่วงแล้วไม่ได้อะไร
      #    ถ้าวันหนึ่ง upstream ออก image ใหม่ ค่อยกลับมาพิจารณา

      # เปิดแล้ว 2026-08-08 — ทดสอบบนเชนจริงแล้วว่า polygon-edge 0.9.0 ตอบ
      # debug_traceBlockByNumber + callTracer ได้ (เดิมปิดไว้เพราะเข้าใจว่าไม่รองรับ)
      # ต้องเปิดก่อนขึ้นสัญญา DEX/masternode ไม่งั้นการโอนที่เกิดจากสัญญาเรียกสัญญา
      # จะไม่โผล่ในหน้า address เลย — ยอดขยับแต่หาที่มาไม่เจอ
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "false"
      INDEXER_DISABLE_BLOCK_REWARD_FETCHER: "true"
      INDEXER_DISABLE_WITHDRAWALS_FETCHER: "true"
      INDEXER_COIN_BALANCES_BATCH_SIZE: "50"
      COIN_BALANCE_ON_DEMAND_FETCHER_ENABLED: "true"
      TOKEN_BALANCE_ON_DEMAND_FETCHER_ENABLED: "true"
      TXS_STATS_ENABLED: "true"
      SHOW_TXS_CHART: "true"
      SHOW_PRICE_CHART: "false"
      DISABLE_EXCHANGE_RATES: "true"
    ports: ["127.0.0.1:4000:4000"]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks: [tpix]

  # ── บริการเสริมของ Blockscout ───────────────────────────────────────────────
  # ปักหมุดด้วย digest ไม่ใช่ :latest — ทั้งสามตัวไม่มี tag แบบ semver ให้ใช้
  # (ค่า version อยู่ใน label เท่านั้น) ถ้าใช้ latest วันหนึ่ง restart แล้วได้
  # รุ่นใหม่ที่ schema ไม่เข้ากัน จะพังโดยไม่มีใครสั่งอะไรเลย
  # อัปเดตเวอร์ชัน = pull latest ใหม่ แล้วเอา digest มาแปะที่นี่

  # ยืนยันซอร์สโค้ดสัญญา (Solidity) — สำคัญก่อนขึ้น NodeRegistry/Router/TokenSale
  blockscout-sc-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier@sha256:c9e4e022ba2b1cc24fe70e581d835e873c6c374545b3a0fd209e16ff03f93d78  # v1.10.6
    container_name: blockscout-sc-verifier
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ADDR: 0.0.0.0:8050
      SMART_CONTRACT_VERIFIER__SOLIDITY__ENABLED: "true"
      SMART_CONTRACT_VERIFIER__SOLIDITY__COMPILERS_DIR: /compilers
      SMART_CONTRACT_VERIFIER__SOLIDITY__REFRESH_VERSIONS_SCHEDULE: "0 0 * * * * *"
      SMART_CONTRACT_VERIFIER__VYPER__ENABLED: "false"
      # Sourcify เป็นฐานข้อมูลกลางที่ไม่รู้จัก chain 4289 — เปิดไว้ก็ได้แต่ 404 เปล่าๆ
      SMART_CONTRACT_VERIFIER__SOURCIFY__ENABLED: "false"
      SMART_CONTRACT_VERIFIER__METRICS__ENABLED: "false"
      RUST_LOG: info
    volumes:
      # เก็บ solc ที่โหลดมาไว้ ไม่งั้น restart ทีโหลดคอมไพเลอร์ใหม่ทุกเวอร์ชัน
      - sc-verifier-compilers:/compilers
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks: [tpix]

  # (sig-provider ถูกถอดออก — ดูเหตุผลเต็มในคอมเมนต์ที่ blockscout-backend)

  # วาดผังโครงสร้างสัญญา (sol2uml) — ใช้คู่กับ sc-verifier ข้างบน
  # พอสัญญาถูกยืนยันซอร์สแล้ว หน้า contract จะมีแท็บวาดผังความสัมพันธ์ให้ดู
  # ไม่มีบริการนี้ = แท็บนั้นไม่โผล่เลย
  blockscout-visualizer:
    image: ghcr.io/blockscout/visualizer@sha256:ffce88a765b0466824175cc8fed6e6b31d682310a96933b98451aefdfffecdc7
    container_name: blockscout-visualizer
    restart: unless-stopped
    mem_limit: 512m
    environment:
      VISUALIZER__SERVER__GRPC__ENABLED: "false"
      VISUALIZER__SERVER__HTTP__ADDR: 0.0.0.0:8050
      VISUALIZER__METRICS__ENABLED: "false"
      RUST_LOG: info
    ports: ["127.0.0.1:8154:8050"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks: [tpix]

  # กราฟและสถิติ — หน้า /stats ของ explorer ตอบ 404 มาตลอดเพราะขาดตัวนี้
  # ใช้ postgres ตัวเดิม แต่แยกฐานข้อมูล `stats` (CREATE_DATABASE สร้างให้เอง)
  blockscout-stats:
    image: ghcr.io/blockscout/stats@sha256:1091cacba9287b6930575fac2aa3512dec3a8e81de58316ca63a6c20e1ddc457  # v2.17.0
    container_name: blockscout-stats
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      blockscout-db: { condition: service_healthy }
    environment:
      STATS__DB_URL: postgresql://${BS_USER}:${BS_PASS}@blockscout-db:5432/stats
      STATS__BLOCKSCOUT_DB_URL: postgresql://${BS_USER}:${BS_PASS}@blockscout-db:5432/${BS_DB}
      STATS__BLOCKSCOUT_API_URL: http://blockscout-backend:4000
      STATS__CREATE_DATABASE: "true"
      STATS__RUN_MIGRATIONS: "true"
      STATS__SERVER__HTTP__ADDR: 0.0.0.0:8050
      STATS__METRICS__ENABLED: "false"
      RUST_LOG: info
    volumes:
      # charts.json ฝัง "native_coin_symbol": "ETH" มาใน image และไม่มี env ให้ override
      # ถ้าไม่ทับ หน้า /stats จะเขียน "Transactions fees (24h) 0 ETH" กับ
      # "Number of ETH transfers" ทั้งที่เชนนี้ใช้ TPIX
      # สร้างไฟล์นี้ด้วย sync-stats-charts.sh (ต้องรันใหม่ทุกครั้งที่เปลี่ยน digest)
      - /opt/tpix/blockscout/stats-charts.json:/app/config/blockscout_instance/charts.json:ro
    ports: ["127.0.0.1:8153:8050"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks: [tpix]

  blockscout-frontend:
    image: ghcr.io/blockscout/frontend:v1.38.0
    container_name: blockscout-frontend
    restart: unless-stopped
    mem_limit: 768m
    depends_on: [blockscout-backend]
    environment:
      NEXT_PUBLIC_API_HOST: explorer.tpix.online
      NEXT_PUBLIC_API_PORT: "443"
      NEXT_PUBLIC_API_PROTOCOL: https
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: wss
      NEXT_PUBLIC_APP_HOST: explorer.tpix.online
      NEXT_PUBLIC_APP_PROTOCOL: https
      NEXT_PUBLIC_APP_PORT: "443"
      NEXT_PUBLIC_NETWORK_NAME: "TPIX Chain"
      NEXT_PUBLIC_NETWORK_SHORT_NAME: "TPIX"
      NEXT_PUBLIC_NETWORK_ID: "4289"
      NEXT_PUBLIC_NETWORK_RPC_URL: "https://rpc1.tpix.online"
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: "TPIX"
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: "TPIX"
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "false"
      # LOGO = โลโก้แนวนอน (ใช้ตอนแถบหัวกางเต็ม) · ICON = ไอคอนจัตุรัส (ตอนแถบหุบ/จอมือถือ)
      # ⚠️ สองอย่างนี้ต้องเป็นคนละรูป — เดิมตั้งเป็นไฟล์เดียวกันทั้งคู่ ผลคือรูปแนวนอน
      # อัตราส่วน 2.36:1 ถูกยัดลงช่องจัตุรัส 30×30 ที่ overflow:hidden แล้วบีบเหลือ
      # 30×60 กลายเป็นโลโก้ผอมสูงอ่านไม่ออก (ยืนยันจากเว็บจริง 2026-08-08)
      NEXT_PUBLIC_NETWORK_LOGO: "https://tpix.online/images/logotpixexplorer.webp"
      NEXT_PUBLIC_NETWORK_LOGO_DARK: "https://tpix.online/images/logotpixexplorer.webp"
      NEXT_PUBLIC_NETWORK_ICON: "https://tpix.online/images/tpix-logo-512.png"
      NEXT_PUBLIC_NETWORK_ICON_DARK: "https://tpix.online/images/tpix-logo-512.png"
      NEXT_PUBLIC_COLOR_THEME_DEFAULT: "dark"
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "['daily_txs']"
      NEXT_PUBLIC_WEB3_WALLETS: "['metamask']"
      NEXT_PUBLIC_PROMOTE_BLOCKSCOUT_IN_TITLE: "false"
      NEXT_PUBLIC_AD_BANNER_PROVIDER: "none"
      NEXT_PUBLIC_AD_TEXT_PROVIDER: "none"

      # ── favicon ────────────────────────────────────────────────────────────
      # ไม่มี prefix NEXT_PUBLIC โดยตั้งใจ — favicon_generator.sh อ่านตัวนี้ตอนบูต
      # ถ้าไม่ตั้ง มัน fallback ไป NEXT_PUBLIC_NETWORK_ICON ซึ่งเป็น .webp
      # ตัวสร้าง favicon อ่าน webp ไม่ได้ → พังเงียบ → /favicon.ico ตอบ 404
      # และแท็บเบราว์เซอร์ไม่มีไอคอน (ยืนยันจากเว็บจริง 2026-08-08)
      # ต้องเป็น PNG/JPG/SVG เท่านั้น
      FAVICON_MASTER_URL: "https://tpix.online/images/tpix-logo-512.png"
      # รูปที่ขึ้นตอนแชร์ลิงก์ใน LINE/Facebook/X — ไม่ตั้ง = ได้โลโก้ Blockscout
      NEXT_PUBLIC_OG_IMAGE_URL: "https://tpix.online/images/tpix-logo-512.png"

      # ── หน้า /stats (กราฟ) ─────────────────────────────────────────────────
      # ใช้ path บนโดเมนเดิม ไม่แยก subdomain — เลี่ยงงาน DNS + ใบรับรองใหม่
      # และเป็น same-origin เลยไม่ต้องยุ่งกับ CORS ด้วย
      # nginx ส่ง /stats-api/ → 127.0.0.1:8153 (ดู nginx-explorer.conf)
      NEXT_PUBLIC_STATS_API_HOST: "https://explorer.tpix.online"
      NEXT_PUBLIC_STATS_API_BASE_PATH: "/stats-api"

      # ── ให้ตรงกับความจริงของเชนนี้ ─────────────────────────────────────────
      # IBFT2 เป็น PoA ไม่ใช่ PoW — ตั้งค่านี้แล้วหน้าเว็บเรียก "Validator"
      # แทน "Miner" ซึ่งตรงกับสิ่งที่ผู้ใช้เห็นจริงมากกว่า
      NEXT_PUBLIC_NETWORK_VERIFICATION_TYPE: "validation"

      # ── ของที่ Blockscout ทำได้อยู่แล้วแต่ไม่เคยเปิด (ตรวจแล้ว 2026-08-08) ──
      # ⚠️ ตัวนี้เป็น no-op — ตั้งไว้เพื่อประกาศเจตนาเท่านั้น
      # โค้ดจริงเช็คว่า `"false" === env` แปลว่าฟีเจอร์ **เปิดอยู่แล้วโดยปริยาย**
      # จะปิดได้ต้องใส่ "false" เท่านั้น ใส่ "true" ไม่ได้เปลี่ยนอะไร
      # และ v1.38.0 **ไม่มีเมนู /advanced-filter ในตัวเลย** (ไม่มีนิยามใน bundle)
      # เข้าได้ทาง URL ตรงอย่างเดียว → จึงเพิ่มลิงก์ไว้ใน footer ให้คนหาเจอ
      NEXT_PUBLIC_ADVANCED_FILTER_ENABLED: "true"
      # รองรับส่วนขยายเบราว์เซอร์ MetaSuites (ฟรี ไม่ต้องต่อบริการอะไร)
      NEXT_PUBLIC_METASUITES_ENABLED: "true"
      # ใส่ข้อมูลจริงของหน้านั้นๆ ลง meta tag — ตอนแชร์ลิงก์ที่อยู่/ธุรกรรมใน
      # LINE/Facebook/X จะขึ้นยอดและรายละเอียด ไม่ใช่ข้อความเดียวกันหมดทุกหน้า
      NEXT_PUBLIC_SEO_ENHANCED_DATA_ENABLED: "true"
      NEXT_PUBLIC_OG_ENHANCED_DATA_ENABLED: "true"
      NEXT_PUBLIC_OG_DESCRIPTION: "TPIX Chain block explorer — ตรวจสอบบล็อก ธุรกรรม และกระเป๋าบนเชน TPIX (chain ID 4289) ได้แบบสาธารณะตลอดเวลา"
      # แถบหน้าแรกใช้สีแบรนด์ TPIX แทนสีเริ่มต้นของ Blockscout
      # ใช้ HERO_BANNER_CONFIG ไม่ใช่ HOMEPAGE_PLATE_* — ตัวหลัง deprecated แล้ว
      # (ตัว validator ของ v1.38.0 เตือนตรงๆ ว่าจะถูกถอดออกในรุ่นถัดไป)
      # ค่าเป็น array เพื่อรองรับธีมสว่าง/มืดแยกกัน ที่นี่ใส่ค่าเดียวใช้ทั้งสองธีม
      NEXT_PUBLIC_HOMEPAGE_HERO_BANNER_CONFIG: '{"background":["linear-gradient(136deg, rgb(6,182,212) 0%, rgb(14,116,144) 50%, rgb(15,23,42) 100%)"],"text_color":["white"]}'
      # ปุ่ม "เปิดใน Remix" บนหน้าสัญญาที่ยืนยันซอร์สแล้ว
      # {hash} กับ {domain} เป็นตัวแทนที่ Blockscout เติมให้เอง
      NEXT_PUBLIC_CONTRACT_CODE_IDES: '[{"title":"Remix IDE","url":"https://remix.ethereum.org/?address={hash}&blockscout={domain}","icon_url":"https://tpix.online/images/tpix-logo-512.png"}]'
      # ลิงก์เพิ่มในเมนู — ผูก explorer เข้ากับ ecosystem ที่เหลือ
      NEXT_PUBLIC_OTHER_LINKS: '[{"text":"TPIX Chain","url":"https://tpix.online"},{"text":"Whitepaper","url":"https://tpix.online/whitepaper"},{"text":"RPC Endpoint","url":"https://rpc1.tpix.online"}]'
      # ลิงก์ท้ายเว็บ — ไฟล์ JSON เสิร์ฟจาก nginx เครื่องเดียวกัน (ดู nginx-explorer.conf)
      # frontend ดาวน์โหลดไฟล์นี้ตอนบูต ถ้าโหลดไม่ได้จะข้ามไปเฉยๆ ไม่ทำให้ล้ม
      NEXT_PUBLIC_FOOTER_LINKS: "https://explorer.tpix.online/tpix-footer-links.json"
      # ผังโครงสร้างสัญญา — เส้นทางเดียวกับ stats คือ path บนโดเมนเดิม
      NEXT_PUBLIC_VISUALIZE_API_HOST: "https://explorer.tpix.online"
      NEXT_PUBLIC_VISUALIZE_API_BASE_PATH: "/visualize-api"
      # แก๊สเป็นศูนย์ทั้งเชน (--price-limit 0) ตัวติดตามราคาแก๊สจึงโชว์ค่าว่าง
      # ตลอดกาล ปิดทิ้งดีกว่าให้ผู้ใช้เห็นช่องที่ไม่มีวันมีข้อมูล
      NEXT_PUBLIC_GAS_TRACKER_ENABLED: "false"
      NEXT_PUBLIC_NETWORK_CURRENCY_WEI_NAME: "wei"
      NEXT_PUBLIC_HOMEPAGE_STATS: "['total_blocks','average_block_time','total_txs','wallet_addresses']"
    ports: ["127.0.0.1:3100:3000"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks: [tpix]

volumes:
  blockscout-db-data:
  sc-verifier-compilers:

networks:
  tpix:
    driver: bridge

# ══════════════════════════════════════════════════════════════════════════════
#  TPIX — ด่าน njs + log ที่ fail2ban อ่านได้
#  ต้นฉบับของ /etc/nginx/conf.d/05-tpix-njs.conf   ← **นี่คือไฟล์ที่ deploy จริง**
#  (ติดตั้งบน tpixserver แล้ว 2026-08-28)
#
#  ทำไมเป็นไฟล์เล็กแยกต่างหาก ไม่ใช่ไปแทน 10-tpix-http.conf ทั้งไฟล์
#  ─────────────────────────────────────────────────────────────────────────────
#  เครื่องจริงมีของที่ผูกกันอยู่ก่อนแล้ว ซึ่ง nginx-http-tpix.conf (ฉบับเขียนใหม่ทั้งไฟล์)
#  ไม่รู้จัก — ถ้าทับทั้งไฟล์จะพังทันที:
#
#    99-tpix-debug.conf  ประกาศ log_format tpixdbg ที่อ้าง $rpc_method_denied
#                        $rpc_body_escaped $rpc_method_allowed ซึ่งมาจาก map
#                        ใน 10-tpix-http.conf → ลบ map ทิ้ง = nginx ไม่สตาร์ท
#
#    00-cloudflare-realip.conf  มี set_real_ip_from + real_ip_header ครบอยู่แล้ว
#                        ตั้งแต่ 6 ส.ค. → ประกาศซ้ำไม่จำเป็น
#                        (ข้อนี้แก้ความเข้าใจผิดเดิมที่คิดว่ายังไม่ได้เปิด real_ip)
#
#  ไฟล์นี้จึงเติมเฉพาะของใหม่ 3 อย่าง แล้วปล่อยของเดิมไว้ทั้งหมด
#  ส่วน nginx-http-tpix.conf เก็บไว้เป็นแบบ "ถ้าตั้งเครื่องใหม่ทั้งลูก" เท่านั้น
#
#  ติดตั้ง:
#    sudo cp infrastructure/single-host/nginx-njs.conf /etc/nginx/conf.d/05-tpix-njs.conf
#    sudo cp infrastructure/njs/tpix-rpc.js /etc/nginx/njs/
#    sudo nginx -t && sudo systemctl restart nginx      # restart ไม่ใช่ reload — ดูล่าง
#    bash infrastructure/scripts/verify-rpc-gate.sh https://rpc.tpix.online
# ══════════════════════════════════════════════════════════════════════════════

# โมดูล njs มากับแพ็กเกจ libnginx-mod-http-js (0.8.2) และ symlink อยู่ใน
# /etc/nginx/modules-enabled/50-mod-http-js.conf แล้ว ไม่ต้อง load_module เอง
# (เช็กด้วย `grep -R load_module /etc/nginx/modules-enabled/` — ต้องใช้ -R ไม่ใช่ -r
#  เพราะ -r ไม่ตาม symlink แล้วจะสรุปผิดว่าโมดูลไม่ได้โหลด)
js_import tpix from /etc/nginx/njs/tpix-rpc.js;

# ⛔ type=number ห้ามลืม — ค่าปริยายเป็น string dict ซึ่ง .incr() ใช้ไม่ได้
#    อาการคือ **ธุรกรรมทุกใบได้ 500** (แย่กว่าไม่มีด่านเลย) โดย nginx -t ผ่านฉลุย
#    ไปโผล่เป็น js exception ใน error log เท่านั้น:
#      "TypeError: shared dict is not a number dict"
#
# ⛔ เปลี่ยนชนิดโซนแล้ว reload ไม่พอ ต้อง **restart**
#      [emerg] js_shared_dict_zone "rpc_write_budget" had previously a different type
#    และที่อันตรายคือ `systemctl reload nginx` **คืนค่าสำเร็จ** ทั้งที่ config ใหม่ถูกปฏิเสธ
#    ตัวเก่ายังวิ่งต่อเงียบ ๆ → ต้องอ่าน error log ยืนยัน อย่าเชื่อ exit code
#
# timeout ต้องเท่ากับ WINDOW_SECONDS ใน tpix-rpc.js
js_shared_dict_zone zone=rpc_write_budget:1m timeout=10s type=number evict;

# งบแก๊สต่อ IP (spendGas ใน tpix-rpc.js) — โซนแยก เพราะหน้าต่างยาวกว่า (60 วิ)
# timeout ต้องเท่ากับ GAS_WINDOW_SECONDS · type=number ห้ามลืมเหมือนโซนบน
# ⛔ ลำดับ deploy: ลงไฟล์นี้ + reload ให้โซนเกิดก่อน แล้วค่อยลง tpix-rpc.js
#    ถ้า tpix-rpc.js ใหม่ขึ้นก่อนโซนนี้ ธุรกรรมทุกใบได้ 429 (ด่าน fail-closed เมื่อโซนหาย)
#    เพิ่มโซนใหม่ใช้ reload ได้ (restart จำเป็นเฉพาะตอนเปลี่ยนชนิดโซนเดิม)
#    ยืนยันบน nginx 1.24.0 + njs 0.8.2 แล้ว (lab/rpc-gate-lab.sh): reload ไม่ล้างตัวนับของโซนเดิม
#    ส่วน restart ล้างตัวนับทุก IP — ยังไม่ได้ทำบนเครื่องจริง
js_shared_dict_zone zone=rpc_gas_budget:2m timeout=60s type=number evict;

# ── กุญแจของชั้นหยาบ (limit_req / limit_conn): IPv4 ต่อที่อยู่ · IPv6 ต่อ /64 ──────────
# ผู้ใช้ IPv6 หนึ่งรายถือทั้ง /64 และเปลี่ยนที่อยู่ต้นทางได้ทุกคำขอ — โซนที่ใช้ $binary_remote_addr
# (16 ไบต์ = /128) จึงให้ 30 r/s กับ 10 connection ใหม่ทุกครั้งที่เปลี่ยนที่อยู่
# ด่าน njs ตัดที่ /64 เหมือนกัน (addressKey ใน tpix-rpc.js) — สองชั้นต้องนับ "ผู้ใช้" หน่วยเดียวกัน
#
#   IPv4            4 ไบต์  → ไม่เข้า regex ไหนเลย → default = ที่อยู่เต็ม
#   ::ffff:a.b.c.d  16 ไบต์ → 4 ไบต์ท้าย = กุญแจเดียวกับ IPv4 ตัวนั้น
#                             (ต้องมาก่อนบรรทัด /64 ไม่งั้น IPv4 ที่ถูกห่อมาทุกตัวกองรวมใน ::/64 ถังเดียว)
#   IPv6 อื่น       16 ไบต์ → 8 ไบต์แรก = /64
#
# ⛔ (?s) ห้ามตัด — ไม่มีแล้ว "." ไม่จับไบต์ 0x0a ที่อยู่ที่มีไบต์นั้น (เช่น 2001:db8:a0a::1)
#    จะหลุดไป default = กลับไปนับต่อ /128 เงียบ ๆ
# ยืนยันบน nginx 1.24.0 แล้ว (lab/rpc-gate-lab.sh ขั้น 7) รวมที่อยู่ที่มีไบต์ 0x00 0x0a 0xff
#
# >>> rpc_client_net — ต้องตรงกับบล็อกเดียวกันใน nginx-http-tpix.conf ทุกบรรทัด (lab ขั้น 6 เทียบให้)
map $binary_remote_addr $rpc_client_net {
    default                                        $binary_remote_addr;
    "~(?s)^\x00{10}\xff\xff(?<rpc_net_v4>.{4})$"   $rpc_net_v4;
    "~(?s)^(?<rpc_net_v6>.{8}).{8}$"               $rpc_net_v6;
}
# <<< rpc_client_net

# โซนชื่อใหม่ ไม่ใช่แก้กุญแจของ rpc_per_ip / rpc_conn_per_ip (ซึ่งประกาศอยู่ใน 10-tpix-http.conf ของเครื่อง)
# ⛔ เปลี่ยนกุญแจของโซนเดิมแล้ว reload = nginx ปฏิเสธ config ใหม่ทั้งก้อน
#      [emerg] limit_req "rpc_per_ip" uses the "$rpc_client_net" key while previously it used the "$binary_remote_addr" key
#    โดย `nginx -t` ผ่าน และ `systemctl reload` คืนค่าสำเร็จ — ตัวเก่าวิ่งต่อเงียบ ๆ (ยืนยันบน lab ขั้น 7)
# โซนใหม่เกิดด้วย reload ได้ และไม่มีผลอะไรจนกว่า vhost (nginx-rpc.conf) จะชี้มาใช้ — RUNBOOK ขั้น 1c
limit_req_zone  $rpc_client_net zone=rpc_per_net:10m rate=30r/s;
limit_conn_zone $rpc_client_net zone=rpc_conn_per_net:10m;

# ⚠️ ต้องคู่กับ fail2ban/filter.d/tpix-rpc.conf เสมอ
#    ฟอร์แมตนี้ = combined มาตรฐาน + 2 ช่องท้าย (cf= กับ rt=)
#    $remote_addr เป็น IP ผู้ใช้จริงอยู่แล้วเพราะ 00-cloudflare-realip.conf เปิด real_ip ไว้
log_format tpixgate '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cf=$http_cf_connecting_ip rt=$request_time';

# ── log ที่ fail2ban อ่าน: ช่องแรก = "หน่วยที่แบน" ไม่ใช่ที่อยู่เต็ม (RUNBOOK ขั้น 3) ──────────
# tpixgate ข้างบนขึ้นต้นด้วย $remote_addr = ที่อยู่เต็ม → fail2ban นับ "ถูกปฏิเสธ 10 ครั้ง/60 วิ" ต่อที่อยู่
# ผู้ใช้ IPv6 ที่หมุนที่อยู่ใน /64 เดียวจึงถูกนับที่อยู่ละครั้ง ไม่มีที่อยู่ไหนถึงเกณฑ์ (เห็นบน lab/rpc-ban-lab.sh)
#
# $rpc_ban_key = banKey() ใน tpix-rpc.js: IPv4 ตามเดิม · IPv6 = ที่อยู่เครือข่ายของ /64 (2001:db8:0:1::)
#                · ::ffff:a.b.c.d = a.b.c.d — หน่วยเดียวกับถังโควตาของด่าน และมาจาก $remote_addr ตัวเดียวกับ
#                ที่ geo $banned_ip ใช้ตัดสิน (ไม่อ่าน header)
# ที่อยู่เต็มของผู้ใช้ยังอยู่ในช่อง cf= ท้ายบรรทัด
#
# ลำดับลง: ไฟล์นี้ก่อนได้ — js_set ที่ยังไม่มีใครเรียกไม่ถูกประเมิน (tpix-rpc.js รุ่นเก่าที่ยังไม่มี banKey ไม่พัง
#          ยืนยันบน lab/rpc-gate-lab.sh ขั้น 2) แต่ vhost ที่ใช้ tpixban ต้องขึ้น **หลัง** tpix-rpc.js ที่มี banKey
#          ไม่งั้นช่องแรกของ log ว่าง fail2ban ไม่แมตช์สักบรรทัด = ไม่แบนใครเลย (lab/rpc-ban-lab.sh ขั้น 6)
#
# >>> rpc_ban_log — ต้องตรงกับบล็อกเดียวกันใน nginx-http-tpix.conf ทุกบรรทัด (lab/rpc-ban-lab.sh เทียบให้)
js_set $rpc_ban_key tpix.banKey;
log_format tpixban '$rpc_ban_key - - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'cf=$http_cf_connecting_ip rt=$request_time';
# <<< rpc_ban_log

# ══════════════════════════════════════════════════════════════════════════════
#  TPIX — ด่าน njs + log ที่ fail2ban อ่านได้
#  ต้นฉบับของ /etc/nginx/conf.d/05-tpix-njs.conf   ← **นี่คือไฟล์ที่ deploy จริง**
#  (ติดตั้งบน tpixserver แล้ว 2026-08-28)
#
#  ทำไมเป็นไฟล์เล็กแยกต่างหาก ไม่ใช่ไปแทน 10-tpix-http.conf ทั้งไฟล์
#  ─────────────────────────────────────────────────────────────────────────────
#  เครื่องจริงมีของที่ผูกกันอยู่ก่อนแล้ว ซึ่ง nginx-http-tpix.conf (ฉบับเขียนใหม่ทั้งไฟล์)
#  ไม่รู้จัก — ถ้าทับทั้งไฟล์จะพังทันที:
#
#    99-tpix-debug.conf  ประกาศ log_format tpixdbg ที่อ้าง $rpc_method_denied
#                        $rpc_body_escaped $rpc_method_allowed ซึ่งมาจาก map
#                        ใน 10-tpix-http.conf → ลบ map ทิ้ง = nginx ไม่สตาร์ท
#
#    00-cloudflare-realip.conf  มี set_real_ip_from + real_ip_header ครบอยู่แล้ว
#                        ตั้งแต่ 6 ส.ค. → ประกาศซ้ำไม่จำเป็น
#                        (ข้อนี้แก้ความเข้าใจผิดเดิมที่คิดว่ายังไม่ได้เปิด real_ip)
#
#  ไฟล์นี้จึงเติมเฉพาะของใหม่ 3 อย่าง แล้วปล่อยของเดิมไว้ทั้งหมด
#  ส่วน nginx-http-tpix.conf เก็บไว้เป็นแบบ "ถ้าตั้งเครื่องใหม่ทั้งลูก" เท่านั้น
#
#  ติดตั้ง:
#    sudo cp infrastructure/single-host/nginx-njs.conf /etc/nginx/conf.d/05-tpix-njs.conf
#    sudo cp infrastructure/njs/tpix-rpc.js /etc/nginx/njs/
#    sudo nginx -t && sudo systemctl restart nginx      # restart ไม่ใช่ reload — ดูล่าง
#    bash infrastructure/scripts/verify-rpc-gate.sh https://rpc.tpix.online
# ══════════════════════════════════════════════════════════════════════════════

# โมดูล njs มากับแพ็กเกจ libnginx-mod-http-js (0.8.2) และ symlink อยู่ใน
# /etc/nginx/modules-enabled/50-mod-http-js.conf แล้ว ไม่ต้อง load_module เอง
# (เช็กด้วย `grep -R load_module /etc/nginx/modules-enabled/` — ต้องใช้ -R ไม่ใช่ -r
#  เพราะ -r ไม่ตาม symlink แล้วจะสรุปผิดว่าโมดูลไม่ได้โหลด)
js_import tpix from /etc/nginx/njs/tpix-rpc.js;

# ⛔ type=number ห้ามลืม — ค่าปริยายเป็น string dict ซึ่ง .incr() ใช้ไม่ได้
#    อาการคือ **ธุรกรรมทุกใบได้ 500** (แย่กว่าไม่มีด่านเลย) โดย nginx -t ผ่านฉลุย
#    ไปโผล่เป็น js exception ใน error log เท่านั้น:
#      "TypeError: shared dict is not a number dict"
#
# ⛔ เปลี่ยนชนิดโซนแล้ว reload ไม่พอ ต้อง **restart**
#      [emerg] js_shared_dict_zone "rpc_write_budget" had previously a different type
#    และที่อันตรายคือ `systemctl reload nginx` **คืนค่าสำเร็จ** ทั้งที่ config ใหม่ถูกปฏิเสธ
#    ตัวเก่ายังวิ่งต่อเงียบ ๆ → ต้องอ่าน error log ยืนยัน อย่าเชื่อ exit code
#
# timeout ต้องเท่ากับ WINDOW_SECONDS ใน tpix-rpc.js
js_shared_dict_zone zone=rpc_write_budget:1m timeout=10s type=number evict;

# ⚠️ ต้องคู่กับ fail2ban/filter.d/tpix-rpc.conf เสมอ
#    ฟอร์แมตนี้ = combined มาตรฐาน + 2 ช่องท้าย (cf= กับ rt=)
#    $remote_addr เป็น IP ผู้ใช้จริงอยู่แล้วเพราะ 00-cloudflare-realip.conf เปิด real_ip ไว้
log_format tpixgate '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cf=$http_cf_connecting_ip rt=$request_time';

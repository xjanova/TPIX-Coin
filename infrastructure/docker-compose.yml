# TPIX Chain — Polygon Edge (IBFT2 PoA, 4 validators)
# ─────────────────────────────────────────────────────
# Prerequisites:
#   1. Run ./setup-chain.sh to generate validator keys & genesis
#   2. Copy data/validator-N/ directories to correct volumes
#
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Logs:   docker-compose logs -f validator-1
# Status: docker-compose ps
#
# Chain ID: 4289 | Block Time: 2s | Gas: Free (price=0)
# IBFT2 fault tolerance: 1 node can fail (3 of 4 needed)
#
# Developed by Xman Studio

version: '3.8'

x-validator-common: &validator-common
  image: 0xpolygon/polygon-edge:0.9.0
  restart: unless-stopped
  networks:
    - tpix-net
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 4G
      reservations:
        cpus: '0.5'
        memory: 1G
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8545 -T 5 || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  # ─── Validator 1 (Boot Node + Primary RPC) ───────────────
  validator-1:
    <<: *validator-common
    container_name: tpix-validator-1
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --block-gas-target 0x1312D00
      --price-limit 0
      --max-enqueued 1024
    volumes:
      - validator1-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      # ⚠️ แก้ 2026-08-05 (SECURITY-AUDIT ข้อ I1) — เดิมสองพอร์ตแรกผูก 0.0.0.0
      #    gRPC 10000 คือช่องแอดมิน: สั่ง `ibft propose` เพิ่ม/ถอด validator,
      #    `peers add/remove` ได้ทั้งหมด บนเครื่องเดียวหลังไฟร์วอลล์ยังพอทน
      #    แต่วินาทีที่ย้ายขึ้น VPS ที่มี public IP = ช่องยึดเชน
      #    JSON-RPC 8545 ก็ไม่ควรโผล่ตรงๆ — ให้ผ่าน rpc-lb (nginx) เท่านั้น
      - "127.0.0.1:8545:8545"    # JSON-RPC — เข้าถึงผ่าน rpc-lb เท่านั้น
      - "127.0.0.1:10000:10000"  # gRPC (admin) — ในเครื่องเท่านั้น
      - "10001:10001"            # libp2p (P2P) — ต้องเปิดออกเน็ต

  # ─── Validator 2 ─────────────────────────────────────────
  validator-2:
    <<: *validator-common
    container_name: tpix-validator-2
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --block-gas-target 0x1312D00
      --price-limit 0
      --max-enqueued 1024
    volumes:
      - validator2-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8546:8545"
    depends_on:
      - validator-1

  # ─── Validator 3 ─────────────────────────────────────────
  validator-3:
    <<: *validator-common
    container_name: tpix-validator-3
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --block-gas-target 0x1312D00
      --price-limit 0
      --max-enqueued 1024
    volumes:
      - validator3-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8547:8545"
    depends_on:
      - validator-1

  # ─── Validator 4 ─────────────────────────────────────────
  validator-4:
    <<: *validator-common
    container_name: tpix-validator-4
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --block-gas-target 0x1312D00
      --price-limit 0
      --max-enqueued 1024
    volumes:
      - validator4-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8548:8545"
    depends_on:
      - validator-1

  # ─── JSON-RPC Load Balancer (Nginx) ──────────────────────
  rpc-lb:
    image: nginx:alpine
    container_name: tpix-rpc-lb
    volumes:
      - ./nginx-rpc.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - tpix-net
    depends_on:
      - validator-1
      - validator-2
      - validator-3
      - validator-4
    restart: unless-stopped

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:

networks:
  tpix-net:
    driver: bridge

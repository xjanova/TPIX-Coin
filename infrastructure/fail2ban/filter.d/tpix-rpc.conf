# Fail2Ban filter — TPIX RPC nginx
# ติดตั้งที่ /etc/fail2ban/filter.d/tpix-rpc.conf
#
# ⚠️ ต้องคู่กับ log_format tpixgate ใน single-host/nginx-http-tpix.conf เสมอ
#    ของเดิมพังเงียบเพราะสองอย่างนี้ไม่ตรงกัน:
#      vhost เขียนลง /var/log/nginx/tpix-dbg.log ด้วยฟอร์แมตกำหนดเอง
#      jail ไปเฝ้า      /var/log/nginx/access.log ด้วย failregex ของฟอร์แมต combined
#    → คนละไฟล์ คนละฟอร์แมต jail จึงไม่เคยแบนใครได้เลย และไม่มีอะไรฟ้อง
#
# ตรวจว่าใช้ได้จริงก่อนเชื่อ (ต้องได้ matched มากกว่า 0):
#   sudo fail2ban-regex /var/log/nginx/tpix-rpc.access.log \
#        /etc/fail2ban/filter.d/tpix-rpc.conf --print-all-matched

[Definition]

# ฟอร์แมตจริงที่ nginx เขียน (tpixgate):
#   1.2.3.4 - - [27/Aug/2026:10:00:00 +0700] "POST / HTTP/1.1" 403 96 "-" "curl/8.0" cf=1.2.3.4 rt=0.001
#
# รหัสที่ถือว่าเป็นพฤติกรรมไม่พึงประสงค์:
#   403 เมธอดต้องห้าม / นอก allow-list / IP ที่ถูกแบนอยู่แล้ว
#   405 ยิงด้วย method ที่ไม่ใช่ POST
#   413 batch เกินเพดาน หรือ body ใหญ่ผิดปกติ
#   429 ยิงรัวเกินโควตา (ทั้งชั้น limit_req และโควตาเขียนของ njs)
#
# ไม่รวม 400 โดยตั้งใจ — client ที่เขียน JSON พลาดจริงก็ได้ 400 ได้ ไม่ควรโดนแบน
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ [^"]*" (?:403|405|413|429) \d+

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}

# Fail2Ban action — แบนที่ชั้น nginx (geo $banned_ip) ไม่ใช่ iptables
# ติดตั้งที่ /etc/fail2ban/action.d/nginx-tpix-banned.conf
# ต้องมี /usr/local/sbin/tpix-nginx-ban (infrastructure/scripts/tpix-nginx-ban.py)
#
# ทำไมไม่ใช้ iptables-multiport ต่อ:
#   origin รับ 80/443 จาก IP ของ Cloudflare เท่านั้น (allow-cloudflare-only.sh)
#   แพ็กเก็ตทุกใบจึงมีต้นทางเป็น Cloudflare — กฎ iptables ที่ระบุ IP ผู้ใช้ไม่ตรงกับแพ็กเก็ตใดเลย
#   fail2ban รายงานว่าแบนแล้ว แต่คำขอของคนนั้นยังเข้าได้ตามปกติ ทั้ง IPv4 และ IPv6
#   (เห็นบน lab/rpc-ban-lab.sh ขั้น 2 ด้วย iptables ตัวจริง)
#   ที่อยู่ผู้ใช้จริงมีอยู่ที่ $remote_addr ของ nginx หลัง real_ip เท่านั้น
#
# <ip> ที่ได้รับ = ช่องแรกของ log_format tpixban:
#   IPv4 → ที่อยู่นั้น · IPv6 → ที่อยู่เครือข่ายของ /64 (2001:db8:0:1::) สคริปต์เขียนเป็น 2001:db8:0:1::/64
#
# ไม่ตั้ง actioncheck โดยตั้งใจ — fail2ban จะเรียกมันก่อน ban/unban ทุกครั้งและทุกครั้งที่เจอ "already banned"
# ถ้ามันล้ม fail2ban จะ stop+start action แล้วแบนซ้ำทั้งชุด = reload nginx เป็นชุด ความผิดพลาดจริงออกจาก
# exit code ของ add/remove อยู่แล้ว (ดูใน /var/log/fail2ban.log)

[Definition]

# เริ่ม/หยุด jail = ล้างเฉพาะบรรทัดที่ action นี้เขียน (บรรทัดใส่มือไม่แตะ)
# ตอนเริ่ม fail2ban เรียก actionban ใหม่เองสำหรับการแบนที่ยังไม่หมดเวลา (จากฐานข้อมูลของมัน)
actionstart = <cmd> flush
actionstop  = <cmd> flush
actionflush = <cmd> flush
actioncheck =

actionban   = <cmd> add <ip>
actionunban = <cmd> remove <ip>

[Init]

script       = /usr/local/sbin/tpix-nginx-ban
# ต้องเป็นไฟล์เดียวกับ include ใน geo $banned_ip (ตรวจ: sudo nginx -T | grep -n -A6 'geo $banned_ip')
map          = /etc/nginx/conf.d/tpix-banned.map
statedir     = /run/tpix-nginx-ban
banlog       = /var/log/tpix-nginx-ban.log
testcmd      = nginx -t
reloadcmd    = systemctl reload nginx
# reload nginx ไม่เกิน 1 ครั้งต่อกี่วินาที — การแบนที่มาถี่กว่านี้ลงไฟล์ทันทีแต่รอ reload รวมกัน
mininterval  = 5

cmd = <script> --map "<map>" --state-dir "<statedir>" --log "<banlog>" --test-cmd "<testcmd>" --reload-cmd "<reloadcmd>" --min-interval <mininterval>

# Fail2Ban jail — TPIX RPC nginx
# ติดตั้งที่ /etc/fail2ban/jail.d/tpix-rpc.conf
# reload: sudo fail2ban-client reload tpix-rpc
#
# ตรวจว่าทำงานจริง (อย่าเชื่อว่า enabled = true แปลว่าใช้ได้):
#   sudo fail2ban-client status tpix-rpc     # "File list" ต้องตรงกับ logpath ข้างล่าง
#   sudo fail2ban-regex /var/log/nginx/tpix-rpc.access.log \
#        /etc/fail2ban/filter.d/tpix-rpc.conf     # ต้องได้ matched > 0

[tpix-rpc]
enabled  = true
filter   = tpix-rpc

# ⚠️ ต้องตรงกับ access_log ใน single-host/nginx-rpc.conf เป๊ะ ๆ
#    ของเดิมชี้ /var/log/nginx/access.log ซึ่ง vhost ของ RPC ไม่ได้เขียนลงไปเลย
logpath  = /var/log/nginx/tpix-rpc.access.log

# 10 คำขอที่ถูกปฏิเสธใน 60 วิ → แบน 1 ชม.
# ตั้ง 10 ไม่ใช่ 5 เพราะ client ที่ตั้งค่าผิดของเราเอง (เช่น masternode-ui รุ่นเก่า
# ที่เรียกเมธอดซึ่งไม่มีแล้ว) จะยิงพลาดเป็นชุด ผู้ใช้ไม่ควรโดนแบนจากบั๊กของเรา
findtime = 60
maxretry = 10
bantime  = 3600

# แบนซ้ำ = แบนนานขึ้นเอง คนยิงถล่มที่กลับมาเรื่อย ๆ จะโดนยาวขึ้นเรื่อย ๆ
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 86400

action = iptables-multiport[name=tpix-rpc, port="80,443", protocol=tcp]

# ── ห้ามใส่ช่วง IP ของ Cloudflare ใน ignoreip อีกต่อไป ─────────────────────────
# ของเดิมใส่ไว้ทั้งชุด ซึ่งถูกก็ต่อเมื่อ **ยังไม่ได้ตั้ง real_ip** เท่านั้น
# ตอนนี้ nginx-http-tpix.conf ตั้ง real_ip_header CF-Connecting-IP แล้ว
# → <HOST> ใน log คือ IP ผู้ใช้จริง ไม่ใช่ IP ของ Cloudflare
# ถ้ายัง ignore ช่วง CF อยู่ = ไม่มีวันแบนใครที่มาทาง CF ซึ่งก็คือทุกคน
#
# ⚠️ ลำดับสำคัญ: ต้องเปิด real_ip ใน nginx **ก่อน** ตัดบรรทัดพวกนั้นออก
#    ถ้าตัดก่อนแล้ว real_ip ยังไม่ทำงาน fail2ban จะแบน IP ของ Cloudflare
#    ซึ่งเท่ากับตัดผู้ใช้ทั้งเว็บออกทีเดียว
ignoreip = 127.0.0.1/8 ::1

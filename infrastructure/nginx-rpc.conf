# TPIX Chain — Hardened RPC Load Balancer
# Endpoint: https://rpc.tpix.online → tpix_rpc upstream
#
# Hardening (2026-05-04):
#   - Per-IP rate limit (30 req/s burst 60) — kills abusive scanners
#   - Per-IP connection limit (10 concurrent)
#   - Body size limit 32KB (well above any legitimate JSON-RPC payload)
#   - Cloudflare real IP restoration (CF-Connecting-IP)
#   - Block bare GET / (scanners hit this) — only POST + OPTIONS allowed
#
# ═══ แก้รอบ 2026-08-05 (ดู docs/SECURITY-AUDIT-2026-08-05.md ข้อ N1–N4) ═══════════
#
#  N1/N2  allow-list เดิมกันไม่ได้จริง — ใส่ deny-list ที่กันได้จริงเพิ่ม
#  N3     429 ถูกแปลงเป็น 403 ทำให้ fail2ban ไม่มีวันแบนใคร → แยกออกมา
#  N4     origin token ถูก comment ไว้ → เปิดใช้ + บังคับให้ตั้งค่าจริง
#
#  ── หลักการที่ต้องเข้าใจก่อนแก้ไฟล์นี้ ────────────────────────────────────────────
#
#  nginx map จับ "สตริงที่ไหนก็ได้ในทั้ง body" ไม่ได้แกะ JSON ผลคือ:
#
#    allow-list  →  ข้ามได้   ยัด "method":"eth_call" ลงใน params แล้วเรียกอะไรก็ได้
#                            {"method":"admin_addPeer","params":["\"method\":\"eth_call\""]}
#                            ← body มีสตริงที่ allow-list ต้องการ จึงผ่าน
#
#    deny-list   →  ข้ามไม่ได้  เพราะจะเรียกเมธอด X ได้ ตัวอักษร "method":"X" ต้องอยู่ใน
#                            body จริงๆ deny regex จึงเห็นแน่นอน ยัดสตริงเพิ่มได้แต่
#                            "ลบ" ของตัวเองออกไม่ได้ → เลวร้ายสุดคือ block ตัวเอง
#
#  ⇒ allow-list เก็บไว้เป็นตัวกรองหยาบ (กันเมธอดแพงที่ไม่ได้ใช้) แต่ **สิ่งที่กันของอันตราย
#    ได้จริงคือ deny-list ด้านล่าง** อย่าไปพึ่ง allow-list เป็นด่านความปลอดภัย
#
#  ช่องเดียวที่ deny-list แบบสตริงยังหลุดได้คือ JSON unicode escape
#  ("method" หรือ "admin_addPeer" — server แกะเป็น admin_addPeer แต่ regex ไม่เห็น)
#  → กันด้วย $rpc_body_escaped ด้านล่าง JSON-RPC ของ EVM ไม่มีเหตุต้องใช้ \u เลย
#
#  ถ้าวันหนึ่งต้องการกรองระดับ JSON จริงๆ ให้เปลี่ยน image เป็น nginx ที่มี njs
#  (`apk add nginx-mod-http-js`) แล้ว JSON.parse อ่าน .method ทุกรายการรวม batch
# ══════════════════════════════════════════════════════════════════════════════════

# ╔════════════════════════════════════════════════════════════════════════════╗
# ║ ⛔ อ่านก่อนใช้ map สามตัวข้างล่างใน `if` — วัดจริงแล้วบนเซิร์ฟเวอร์ 2026-08-06 ║
# ╚════════════════════════════════════════════════════════════════════════════╝
#
#   $rpc_method_denied · $rpc_body_escaped · $rpc_method_allowed
#   ทั้งสามอ่าน $request_body ซึ่ง **ยังว่างเปล่าตอนที่ `if` ทำงาน**
#
#     `if` อยู่ใน rewrite phase
#     nginx อ่าน request body ใน content phase (ตอน proxy_pass) ซึ่งมาทีหลัง
#
#   ผลคือ allow-list ไม่มีวันแมตช์ → **ทุก request ได้ 403 รวมถึง eth_blockNumber**
#   ไม่ใช่แค่เมธอดที่ตั้งใจบล็อก คือ RPC ตายทั้งระบบ
#
#   หลักฐานจาก log_format ที่พิมพ์ตัวแปรออกมาตรงๆ:
#     POST / | content_length=63 | body="-" | denied=0 escaped=0 allowed=0 -> 403
#                                  ^^^^^^^^ body ว่าง ทั้งที่ client ส่งมา 63 ไบต์
#
#   วิธีที่ถูก: ต้องอ่าน body ให้เสร็จก่อนตัดสิน ซึ่ง stock nginx ทำใน `if` ไม่ได้
#   ใช้ njs (`libnginx-mod-http-js`) หรือ lua (`libnginx-mod-http-lua`) แทน
#   บนเซิร์ฟเวอร์ใหม่ติดตั้ง njs 0.8.2 ไว้แล้ว แต่ยังไม่ได้เขียนตัวกรอง
#
#   ระหว่างนี้ด่านที่ยังทำงานจริงและไม่พึ่ง $request_body:
#     rate limit ต่อ IP · limit_conn · body 32k · POST/OPTIONS/HEAD เท่านั้น
#     CF real-IP · geo ban list · $origin_ok token gate
#   และยืนยันจาก upstream จริงแล้วว่า polygon-edge 0.9.0 ปฏิเสธเองอยู่แล้ว:
#     admin_peers -> {"error":{"code":-32601,"message":"the method admin_peers
#                     does not exist/is not available"}}
#
# ──── Rate limit zones (must be in http {} context — see /etc/nginx/nginx.conf)
# Add to /etc/nginx/nginx.conf inside http {} block:
#   limit_req_zone $binary_remote_addr zone=rpc_per_ip:10m rate=30r/s;
#   limit_conn_zone $binary_remote_addr zone=rpc_conn_per_ip:10m;
#   # Trust Cloudflare's CF-Connecting-IP header (only if behind CF)
#   # set_real_ip_from <CF IPv4 ranges>;
#   # set_real_ip_from <CF IPv6 ranges>;
#   # real_ip_header CF-Connecting-IP;

upstream tpix_rpc {
    least_conn;
    # ⚠️ หลังกระจาย validator แล้ว ให้ชี้ "โหนด RPC ที่ไม่มี --seal" เท่านั้น
    #    validator ที่ถือคีย์ไม่ควรรับทราฟฟิกสาธารณะ (ดู REGENESIS-RUNBOOK Phase 5)
    server tpix-validator-1:8545 max_fails=2 fail_timeout=10s;
    server tpix-validator-2:8545 max_fails=2 fail_timeout=10s;
    server tpix-validator-3:8545 max_fails=2 fail_timeout=10s;
    server tpix-validator-4:8545 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# Block list — IPs caught spamming (rebuild via fail2ban)
# Auto-populated by fail2ban; bans expire after 1h
geo $banned_ip {
    default 0;
    # 0 = allowed, 1 = blocked
    # ban entries appended here by fail2ban tpix-rpc jail action
}

# ══════════════════════════════════════════════════════════════════════════════════
#  ด่านที่ 1 — DENY-LIST (นี่คือด่านที่กันได้จริง ห้ามลบ)
#  namespace แอดมิน/ดีบักของ EVM client ทุกตระกูล ไม่ว่า upstream จะเป็นอะไร
#  polygon-edge วันนี้ไม่เปิด namespace พวกนี้บน JSON-RPC แต่:
#    - อัปเกรดรุ่นแล้วอาจเปิด
#    - วันหน้าอาจเอา nginx ตัวนี้ไปหน้า geth/erigon/besu
#  ปิดไว้ก่อนไม่มีข้อเสีย เพราะ frontend ไม่เคยเรียกอะไรในนี้
# ══════════════════════════════════════════════════════════════════════════════════
# ⚠️ ห้ามใส่ `ibft` เป็น namespace รวมในนี้
#    polygon-edge เปิด ibft บน JSON-RPC เป็น **อ่านเท่านั้น** (getSnapshot,
#    getValidatorsByBlockNumber, candidates, status, quorum) ส่วนคำสั่งที่เปลี่ยน
#    validator set (`ibft propose`) วิ่งผ่าน **gRPC 10000** ไม่ใช่ JSON-RPC
#    → บล็อก ibft ทั้ง namespace ไม่ได้เพิ่มความปลอดภัย แต่ทำให้ Masternode app พัง
#      (masternode-ui เรียก ibft_getValidatorsByBlockNumber เพื่อโชว์รายชื่อ validator)
#    สิ่งที่ต้องล็อกจริงคือ gRPC 10000 ให้ผูก 127.0.0.1 — ทำแล้วใน docker-compose.yml
map $request_body $rpc_method_denied {
    default 0;
    "~*\"method\"\s*:\s*\"\s*(admin|debug|personal|txpool|miner|clique|les|engine|dev|erigon|trace|parity|eth_sign|eth_sendTransaction|eth_accounts|eth_signTransaction)" 1;
}

# ══════════════════════════════════════════════════════════════════════════════════
#  N4 — ล็อกให้ทราฟฟิกมาจาก Cloudflare เท่านั้น (ยังไม่บังคับใช้)
#
#  ค่า default ตั้งไว้ที่ 1 = ปล่อยผ่าน เจตนาเพื่อให้ deploy ไฟล์นี้ได้โดย RPC ไม่ล่ม
#  ถ้าตั้งเป็นบังคับใช้ทันทีแล้วยังไม่ได้ตั้ง Transform Rule ฝั่ง Cloudflare
#  ผู้ใช้ทุกคน (mobile wallet + masternode app + เว็บ) จะได้ 403 หมดทันที
#
#  ⭐ ด่านที่ควรทำก่อนและสำคัญกว่านี้: จำกัด IP ที่ระดับไฟร์วอลล์ให้เหลือแค่ช่วงของ
#     Cloudflare — fail-closed ที่ชั้น network ไม่มีทางพลาดจาก config typo
#     ใช้ scripts/allow-cloudflare-only.sh (ทดสอบผลด้วย curl ตรง origin ได้)
#     header token นี้เป็นเข็มขัดเส้นที่สอง
#
#  วิธีเปิดใช้ (3 ขั้น ทำตามลำดับ):
#    1. สร้าง token:  openssl rand -hex 32
#    2. Cloudflare → Rules → Transform Rules → Modify Request Header → Create
#         Set static:  X-CF-Origin-Token = <token ที่ได้>
#       (ตั้งให้ครอบ rpc.tpix.online ทุก path)
#    3. ในบล็อกข้างล่าง: เปลี่ยน `default 1;` → `default 0;`
#       และเปิดคอมเมนต์บรรทัด token พร้อมใส่ค่าจริง
#       แล้ว  nginx -t && nginx -s reload
#    4. ทดสอบ: curl -s -o /dev/null -w '%{http_code}' -X POST http://<origin-ip>/ \
#                 --data '{"jsonrpc":"2.0","method":"eth_chainId","id":1}'
#              ต้องได้ 403   และผ่าน https://rpc.tpix.online ต้องได้ 200
# ══════════════════════════════════════════════════════════════════════════════════
map $http_x_cf_origin_token $origin_ok {
    default 1;                          # ← เปลี่ยนเป็น 0 เมื่อพร้อมบังคับใช้
    # "PASTE_TOKEN_HERE"      1;        # ← เปิดคอมเมนต์พร้อมกันกับบรรทัดบน
}

# ด่านที่ 2 — กัน JSON unicode escape ที่ใช้เลี่ยง deny-list ข้างบน
# EVM JSON-RPC ใช้แต่ hex string กับตัวเลข ไม่มีเหตุต้องมี \u ใน payload เลย
map $request_body $rpc_body_escaped {
    default 0;
    "~\\\\u[0-9a-fA-F]{4}" 1;
}

# ด่านที่ 3 — ALLOW-LIST (ตัวกรองหยาบ ไม่ใช่ด่านความปลอดภัย — อ่านหมายเหตุหัวไฟล์)
# ประโยชน์จริงคือกันเมธอดที่ frontend ไม่ใช้ ลดพื้นที่โจมตีและโหลด upstream
map $request_body $rpc_method_allowed {
    default                                                 0;
    "~*\"method\"\s*:\s*\"eth_blockNumber\""                1;
    "~*\"method\"\s*:\s*\"eth_chainId\""                    1;
    "~*\"method\"\s*:\s*\"eth_call\""                       1;
    "~*\"method\"\s*:\s*\"eth_getBalance\""                 1;
    "~*\"method\"\s*:\s*\"eth_getCode\""                    1;
    "~*\"method\"\s*:\s*\"eth_getStorageAt\""               1;
    "~*\"method\"\s*:\s*\"eth_getTransactionCount\""        1;
    "~*\"method\"\s*:\s*\"eth_getTransactionByHash\""       1;
    "~*\"method\"\s*:\s*\"eth_getTransactionReceipt\""      1;
    "~*\"method\"\s*:\s*\"eth_getBlockByNumber\""           1;
    "~*\"method\"\s*:\s*\"eth_getBlockByHash\""             1;
    "~*\"method\"\s*:\s*\"eth_getLogs\""                    1;
    "~*\"method\"\s*:\s*\"eth_estimateGas\""                1;
    "~*\"method\"\s*:\s*\"eth_gasPrice\""                   1;
    "~*\"method\"\s*:\s*\"eth_maxPriorityFeePerGas\""       1;
    "~*\"method\"\s*:\s*\"eth_feeHistory\""                 1;
    "~*\"method\"\s*:\s*\"eth_sendRawTransaction\""         1;
    "~*\"method\"\s*:\s*\"eth_subscribe\""                  1;
    "~*\"method\"\s*:\s*\"eth_unsubscribe\""                1;
    "~*\"method\"\s*:\s*\"net_version\""                    1;
    "~*\"method\"\s*:\s*\"net_listening\""                  1;
    "~*\"method\"\s*:\s*\"net_peerCount\""                  1;
    "~*\"method\"\s*:\s*\"web3_clientVersion\""             1;
    "~*\"method\"\s*:\s*\"web3_sha3\""                      1;
    # ── ibft (อ่านเท่านั้น) — Masternode app ต้องใช้ ────────────────────────────
    # เพิ่ม 2026-08-05: masternode-ui/electron เรียก ibft_getValidatorsByBlockNumber
    # เพื่อโชว์รายชื่อ validator แต่ allow-list เดิมมีแค่ eth_/net_/web3_
    # → ฟีเจอร์นั้น "ได้ 403 มาตลอด" ทุกครั้งที่ผ่าน rpc.tpix.online โดยไม่มีใครทัก
    # เมธอดกลุ่มนี้อ่านค่าเท่านั้น เปลี่ยน validator set ไม่ได้ (ต้องผ่าน gRPC)
    "~*\"method\"\s*:\s*\"ibft_getValidatorsByBlockNumber\"" 1;
    "~*\"method\"\s*:\s*\"ibft_getSnapshot\""               1;
    "~*\"method\"\s*:\s*\"ibft_candidates\""                1;
    "~*\"method\"\s*:\s*\"ibft_status\""                    1;
    "~*\"method\"\s*:\s*\"ibft_quorum\""                    1;
    # batch (ethers v6 batch เป็นค่า default) — ต้องขึ้นต้นด้วย [ และมี method ที่รู้จัก
    # หมายเหตุ: allow-list ตรวจ batch ทั้งชุดไม่ได้ ตัวที่ปกป้อง batch คือ deny-list ด่านที่ 1
    "~*\\[\\s*\\{[^\\]]*\"method\"\\s*:\\s*\"(eth_|net_|web3_)" 1;
}

# ──── HTTPS RPC server
# ⚠️ N4/I4: origin ควรเป็น TLS ไม่ใช่ listen 80 เปล่า
#    1. Cloudflare SSL/TLS mode ต้องเป็น "Full (strict)" ไม่ใช่ Flexible
#       (Flexible = ช่วง Cloudflare→origin วิ่ง HTTP เปล่าบนเน็ต ดักแก้ผลลัพธ์ eth_call
#        / ยอดคงเหลือ / quote ราคา ได้)
#    2. ติดตั้ง Cloudflare Origin Certificate แล้วเปิด block listen 443 ด้านล่าง
#    3. ไฟร์วอลล์เครื่อง origin อนุญาต 443 เฉพาะช่วง IP ของ Cloudflare
#       (https://www.cloudflare.com/ips/)
server {
    listen 80;
    server_name rpc.tpix.online;

    # เปิดเมื่อมี origin cert แล้ว (แนะนำอย่างยิ่ง):
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    # ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # Hard limits
    client_max_body_size 32k;          # JSON-RPC payloads are tiny; 32k is generous
    client_body_buffer_size 32k;       # ต้องไม่น้อยกว่า client_max_body_size — ถ้า body
                                       # ล้นไปเขียน temp file แล้ว $request_body จะว่าง
                                       # ทำให้ทุก map ข้างบนอ่านค่าไม่ได้
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Per-IP gates
    limit_req zone=rpc_per_ip burst=60 nodelay;
    limit_req_status 429;
    limit_conn rpc_conn_per_ip 10;
    limit_conn_status 429;

    # IP ban shortcut
    if ($banned_ip) {
        return 403 "banned";
    }

    # ── N4: ล็อก origin (ดูวิธีเปิดใช้ที่บล็อก map $origin_ok ด้านบน) ──────────────
    # ตอนนี้ยังปล่อยผ่านตาม `default 1` — ตั้งใจให้ deploy ได้โดย RPC ไม่ล่ม
    # โน้ตในสมอง "BrainX origin IP already public in repo history" ยืนยันว่า
    # สมมติฐาน "ไม่มีใครรู้ IP origin" ใช้ไม่ได้กับโครงสร้างนี้ → ต้องเปิดใช้จริงในที่สุด
    if ($origin_ok = 0) {
        return 403;
    }

    # Drop non-RPC methods at the door
    if ($request_method !~ ^(POST|OPTIONS|HEAD)$) {
        return 405;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # JSON-RPC endpoint
    location / {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain charset=UTF-8";
            return 204;
        }

        if ($request_method = GET) {
            return 405;
        }

        # ── ลำดับด่านสำคัญ: deny ก่อน allow เสมอ ────────────────────────────────
        # ด่านที่ 1 — namespace อันตราย (กันได้จริง ข้ามไม่ได้ด้วยการยัดสตริง)
        if ($rpc_method_denied) {
            return 403 "method blocked";
        }

        # ด่านที่ 2 — unicode escape (ทางเดียวที่จะเลี่ยงด่านที่ 1 ได้)
        if ($rpc_body_escaped) {
            return 403 "malformed payload";
        }

        # ด่านที่ 3 — allow-list หยาบ (best-effort ไม่ใช่ด่านความปลอดภัย)
        if ($rpc_method_allowed = 0) {
            return 403 "method blocked";
        }

        proxy_pass http://tpix_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ไม่ส่ง origin token ต่อขึ้น upstream
        proxy_set_header X-CF-Origin-Token "";

        # WebSocket support (eth_subscribe)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # CORS — RPC สาธารณะ ใช้ * ตรงๆ ดีกว่า reflect $http_origin กลับ
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Hardening
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── N3: 429 ต้องคง status เป็น 429 ────────────────────────────────────────────
    # ของเดิมเขียน `error_page 403 404 405 429 = @blocked;` ซึ่งแปลง 429 → 403
    # ทั้งใน response และใน access log → fail2ban jail ที่ match " 429 " ไม่มีวันเจอ
    # rate limit ยังทำงานอยู่ แต่ไม่มีการแบนเกิดขึ้นจริงเลยตลอดมา
    #
    # แก้โดย "ไม่ดัก 429 เลย" ปล่อยให้ nginx ตอบหน้า 429 มาตรฐานของตัวเอง
    # (เจตนา ไม่ใช่ลืม) — ได้ status ถูกต้องใน access log และเลี่ยงความเสี่ยง
    # internal redirection cycle จากการ return 429 ภายใน error_page ของ 429 เอง
    # body สวยๆ ไม่คุ้มกับความเสี่ยงตรงนี้ fail2ban อ่านแค่ status code
    error_page 403 404 405 = @blocked;

    location @blocked {
        default_type application/json;
        return 403 '{"error":{"code":-32601,"message":"forbidden"}}';
    }
}

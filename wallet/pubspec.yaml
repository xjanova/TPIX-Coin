name: tpix_wallet
description: "TPIX Wallet — The official wallet for TPIX Chain. Send, receive, and manage TPIX with stunning 3D animations."
publish_to: 'none'
version: 1.13.28+55

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Web3 / Blockchain
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  hex: ^0.2.0
  http: ^1.4.0

  # WalletConnect v2 (Reown)
  reown_walletkit: ^1.1.0
  app_links: ^6.3.2

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # State Management
  provider: ^6.1.5

  # UI / Animation
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Utils
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  package_info_plus: ^8.3.0

  # Audio
  audioplayers: ^6.1.0

  # Location (for recovery)
  geolocator: ^13.0.2

  # Auto-update
  dio: ^5.8.0+1
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # รัน sqflite บนเดสก์ท็อปได้ เพื่อทดสอบ schema + การอัปเกรดฐานข้อมูล
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.3

# ไอคอนแอปต้องใช้ต้นฉบับ 2048px (iOS App Store ขอ 1024x1024 ถ้าย่อกว่านั้นจะเบลอ)
# ไฟล์ต้นฉบับอยู่ที่ assets/icon/ ซึ่ง "ไม่ได้" ประกาศไว้ใน flutter.assets ข้างล่าง
# จึงไม่ถูกแพ็กลง APK — ใช้ตอนเจนไอคอนอย่างเดียว
# ส่วน assets/images/logowallet.png ที่แอปเรียกใช้จริงย่อเหลือ 512px แล้ว
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/tpix_icon_1024.png"
  # พื้นหลัง adaptive icon = สีพื้นของไทล์ ให้ต่อเนื่องกับตัวมาร์คพอดี
  adaptive_icon_background: "#05080E"
  # foreground แยกไฟล์: มาร์คอย่างเดียว พื้นโปร่ง กินพื้นที่ 60% ของกรอบ
  # แอนดรอยด์ครอปไอคอนเป็นวงกลม/สี่เหลี่ยมมนแล้วแต่เครื่อง ถ้ามาร์คเต็มกรอบจะโดนตัดมุม
  adaptive_icon_foreground: "assets/icon/tpix_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # โฟลเดอร์ย่อยต้องประกาศแยก Flutter ไม่ไล่ให้อัตโนมัติ
    - assets/images/icons/

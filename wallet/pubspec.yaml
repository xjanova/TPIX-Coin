name: tpix_wallet
description: "TPIX Wallet — The official wallet for TPIX Chain. Send, receive, and manage TPIX with stunning 3D animations."
publish_to: 'none'
version: 1.13.42+69

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Web3 / Blockchain
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  hex: ^0.2.0
  http: ^1.4.0

  # WalletConnect v2 (Reown)
  reown_walletkit: ^1.1.0
  app_links: ^6.3.2

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # State Management
  provider: ^6.1.5

  # UI / Animation
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  # ธีม Obsidian: คลิปพื้นหลังวนลูป (ไม่มีเสียง) หลังครึ่งบนของจอ
  video_player: ^2.11.1
  mobile_scanner: ^7.0.2
  # โลโก้โทเค็น: แคชลงดิสก์ เปิดแอปออฟไลน์ก็ยังเห็นโลโก้ ไม่โหลดซ้ำทุกครั้ง
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Utils
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  package_info_plus: ^8.3.0

  # Audio
  audioplayers: ^6.1.0

  # Location (for recovery)
  geolocator: ^13.0.2

  # Auto-update
  dio: ^5.8.0+1
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # รัน sqflite บนเดสก์ท็อปได้ เพื่อทดสอบ schema + การอัปเกรดฐานข้อมูล
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.3

# ไอคอนแอปต้องใช้ต้นฉบับ 2048px (iOS App Store ขอ 1024x1024 ถ้าย่อกว่านั้นจะเบลอ)
# ไฟล์ต้นฉบับอยู่ที่ assets/icon/ ซึ่ง "ไม่ได้" ประกาศไว้ใน flutter.assets ข้างล่าง
# จึงไม่ถูกแพ็กลง APK — ใช้ตอนเจนไอคอนอย่างเดียว
# ส่วน assets/images/logowallet.png ที่แอปเรียกใช้จริงย่อเหลือ 512px แล้ว
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/tpix_icon_1024.png"
  # ไอคอน = ObsidianBrandOrb ในแอป (วงแหวนไล่สี + ตรา TPIX) ให้ตรงกับที่เห็นใน splash/onboarding
  # เจนจาก scratch script make_wallet_icon.py (Edge headless วาด path ตราเดียวกับ TpixMonogram)
  adaptive_icon_background: "assets/icon/tpix_icon_bg.png"
  # foreground: orb อย่างเดียว พื้นโปร่ง — ปลั๊กอินหดชั้นนี้ inset 16% จึงวาด orb ไว้ 0.60/0.68 ของไฟล์
  # (บนไอคอนจริง orb กว้าง 60% ของกรอบ อยู่ในวงปลอดภัย 66%)
  # แอนดรอยด์ครอปไอคอนเป็นวงกลม/สี่เหลี่ยมมนแล้วแต่เครื่อง ถ้ามาร์คเต็มกรอบจะโดนตัดมุม
  adaptive_icon_foreground: "assets/icon/tpix_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # โฟลเดอร์ย่อยต้องประกาศแยก Flutter ไม่ไล่ให้อัตโนมัติ
    - assets/images/icons/
    # ── ธีม Obsidian ──
    # ประกาศทีละไฟล์โดยตั้งใจ (ไม่ใช้ทั้งโฟลเดอร์) — กันไฟล์ต้นฉบับใหญ่ ๆ หลุดลง APK
    # ต้นฉบับอยู่ที่ D:/Code/TPIX/design/tpix-wallet-v2 ย่อไว้ราว 2 เท่าของขนาดที่วาดจริง:
    #   ไอคอนมีกรอบ 176px · ไอคอนลอย 112px · ตราระดับโหนด 256px · หน้าบัตร 1024px JPEG q85
    #   ตราเชน (หน้ากากขาว) 192px · โลโก้เชน/เหรียญสีทางการ 96px · คลิป 544x800 ตามต้นฉบับ
    - assets/obsidian/cards/card_bnb.jpg
    - assets/obsidian/cards/card_eth.jpg
    - assets/obsidian/cards/card_pol.jpg
    - assets/obsidian/cards/card_tpix.jpg
    - assets/obsidian/icons/ic_activity.webp

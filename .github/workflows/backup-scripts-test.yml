name: Backup scripts
on:
  pull_request:
    paths: ['infrastructure/scripts/*backup*.sh', 'infrastructure/scripts/tests/**', '.github/workflows/backup-scripts-test.yml']
  push:
    branches: [main]
    paths: ['infrastructure/scripts/*backup*.sh', 'infrastructure/scripts/tests/**', '.github/workflows/backup-scripts-test.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and failure-path tests
        run: |
          bash -n infrastructure/scripts/backup-upload-r2.sh
          bash -n infrastructure/scripts/setup-r2-backup.sh
          bash infrastructure/scripts/tests/backup-upload-r2.test.sh
          bash infrastructure/scripts/tests/setup-r2-quoting.test.sh

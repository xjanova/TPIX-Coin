name: TPIX Chain Health Check (4h backup)

# 2026-05-15 — เปลี่ยนจากทุก 5 นาที เป็นทุก 4 ชั่วโมง
# เหตุผล: server-side cron (infrastructure/scripts/chain-watchdog.sh) เป็น
# watchdog หลัก รันทุก 1 นาทีบน server มี restart-loop guard + healthchecks.io
# external alert
#
# GH workflow นี้เก็บไว้เป็น "เซฟตี้เน็ตอันสุดท้าย" — ครอบคลุมกรณีที่:
#   - server cron แตก (cron daemon ตาย / disk full / script bug)
#   - healthchecks.io alert ไม่ส่ง (email โดน spam filter)
#   - หรือลูกค้าอยากกด manual ผ่าน Actions UI
#
# 2026-10-11 — เปลี่ยนเป็น "ตรวจอย่างเดียว ไม่สั่งรีสตาร์ต" ผ่านอุโมงค์ SSH ส่วนตัว (เจ้าของเลือก)
#   - ของเดิมใช้กุญแจ tpixadmin (sudo) — บนเครื่องเชนใหม่ไม่เคยมีกุญแจนี้ workflow จึงล้มที่ SSH
#     ทุกรอบตั้งแต่ย้ายเครื่อง โดยไม่ได้ตรวจอะไรเลย
#   - ให้ GitHub ถือกุญแจที่ sudo ได้ = secret หลุดเมื่อไรคุมเครื่องเชนได้ทั้งเครื่อง
#   - ตอนนี้ใช้ผู้ใช้ tpixtunnel: ไม่มี shell, authorized_keys บังคับ restrict + permitopen=127.0.0.1:8545
#     ทำได้อย่างเดียวคือส่งต่อพอร์ต RPC ของ validator-1 · การรีสตาร์ตเป็นหน้าที่ของ chain-watchdog บนเครื่อง
#   - Cloudflare บล็อก IP ของเครื่อง GitHub ที่ rpc/rpc1.tpix.online — จึงต้องผ่านอุโมงค์ ไม่ใช่ RPC สาธารณะ
#   - เชนหยุด/เครื่องดับ/ต่ออุโมงค์ไม่ได้ = workflow ล้ม → GitHub ส่งอีเมลแจ้งเจ้าของ
on:
  schedule:
    - cron: '0 */4 * * *'  # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check chain health via private tunnel (read-only)
        env:
          CHAIN_TUNNEL_KEY: ${{ secrets.CHAIN_TUNNEL_KEY }}
          CHAIN_TUNNEL_KNOWN_HOSTS: ${{ secrets.CHAIN_TUNNEL_KNOWN_HOSTS }}
          # ที่อยู่เครื่องเชน — ถ้าย้ายเครื่อง ต้องแก้ตรงนี้ + infrastructure/CHAIN_HOST
          # + secret CHAIN_TUNNEL_KNOWN_HOSTS (host key ใหม่) พร้อมกัน ไม่งั้นต่อไม่ติดแล้วล้มดัง ๆ (ตั้งใจ)
          CHAIN_TUNNEL_HOST: 123.253.62.252
        run: |
          set -u
          if [ -z "${CHAIN_TUNNEL_KEY:-}" ] || [ -z "${CHAIN_TUNNEL_KNOWN_HOSTS:-}" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret CHAIN_TUNNEL_KEY / CHAIN_TUNNEL_KNOWN_HOSTS"
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/tpix_tunnel"; KH="$RUNNER_TEMP/tpix_known_hosts"
          printf '%s\n' "$CHAIN_TUNNEL_KEY" > "$KEY"
          printf '%s\n' "$CHAIN_TUNNEL_KNOWN_HOSTS" > "$KH"
          # host key ถูกตรึง (StrictHostKeyChecking=yes) — ต่อผิดเครื่อง = ล้ม ไม่ใช่ไปตรวจเครื่องเก่าอย่างมั่นใจ
          ssh -i "$KEY" -o UserKnownHostsFile="$KH" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o BatchMode=yes \
              -N -L 18545:127.0.0.1:8545 "tpixtunnel@${CHAIN_TUNNEL_HOST}" &
          TUNNEL_PID=$!
          trap 'kill $TUNNEL_PID 2>/dev/null || true; rm -f "$KEY" "$KH"' EXIT

          rpc() {
            curl -s -m 10 -X POST http://127.0.0.1:18545 -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":${2:-[]}}"
          }
          hexfield() { python3 -c "import sys,json;r=json.load(sys.stdin).get('result');print(int((r if isinstance(r,str) else r['$1']),16))"; }

          for i in $(seq 1 20); do
            rpc eth_chainId | grep -q '"0x10c1"' && break
            sleep 1
          done

          echo "=== TPIX Health Check — $(date -u) ==="
          CHAIN_ID=$(rpc eth_chainId | hexfield result 2>/dev/null || echo 0)
          if [ "$CHAIN_ID" != "4289" ]; then
            echo "::error::ต่ออุโมงค์/อ่าน RPC ไม่ได้ หรือ chainId ผิด ($CHAIN_ID) — เครื่องเชนอาจดับ"
            exit 1
          fi

          B1=$(rpc eth_blockNumber | hexfield result)
          sleep 10
          B2=$(rpc eth_blockNumber | hexfield result)
          DIFF=$((B2 - B1))
          TS=$(rpc eth_getBlockByNumber '["latest",false]' | hexfield timestamp)
          AGE=$(( $(date +%s) - TS ))
          echo "Block: $B1 → $B2 (+$DIFF ใน 10 วิ) · บล็อกล่าสุดอายุ ${AGE}s"

          if [ "$DIFF" -le 0 ] || [ "$AGE" -gt 60 ]; then
            echo "::error::🔴 เชนหยุดเดิน — บล็อกไม่ขยับใน 10 วิ หรือบล็อกล่าสุดเก่าเกิน 60 วิ"
            echo "workflow นี้ไม่สั่งรีสตาร์ต — chain-watchdog บนเครื่องควรกู้เอง ถ้ายังหยุดอยู่ต้องเข้าไปดูด้วยมือ"
            exit 1
          fi
          echo "✅ เชนปกติ — ~$((DIFF * 6)) บล็อก/นาที"

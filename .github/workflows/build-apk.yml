# TPIX Wallet — Build APK Workflow
# Builds Android APK and publishes to GitHub Releases on tag push.

name: Build TPIX Wallet APK

on:
  push:
    branches: [main]
    paths:
      - 'wallet/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: wallet

jobs:
  build:
    name: Build Wallet APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Auto-bump version
        working-directory: .
        run: |
          FILE="wallet/pubspec.yaml"
          CURRENT=$(grep '^version:' "$FILE" | awk '{print $2}')
          SEMVER="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          MAJOR=$(echo "$SEMVER" | cut -d. -f1)
          MINOR=$(echo "$SEMVER" | cut -d. -f2)
          PATCH=$(echo "$SEMVER" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD + 1))
          NEW_SEMVER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_FULL="${NEW_SEMVER}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: ${NEW_FULL}/" "$FILE"
          echo "OLD_VERSION=${CURRENT}" >> $GITHUB_ENV
          echo "NEW_VERSION=${NEW_FULL}" >> $GITHUB_ENV
          echo "SEMVER=${NEW_SEMVER}" >> $GITHUB_ENV
          echo "📦 Version: ${CURRENT} → ${NEW_FULL}"

      - name: Commit version bump
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wallet/pubspec.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(wallet): v${SEMVER} [skip ci]"

          # Retry push 3 ครั้งพร้อม --autostash (กัน race กับ dev push + build artifacts)
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            git pull --rebase --autostash origin main || true
          done
          echo "WARN: Push failed after 3 attempts — continuing build"
          exit 0

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Rename APK
        working-directory: .
        run: |
          cp wallet/build/app/outputs/flutter-apk/app-release.apk "TPIX-Wallet-v${SEMVER}.apk"
          echo "APK_NAME=TPIX-Wallet-v${SEMVER}.apk" >> $GITHUB_ENV

      # ถอด upload-artifact ออกแล้ว — APK ถูกแนบเข้า Release ทุกรอบอยู่แล้ว
      # เก็บซ้ำอีกชุดคือกินโควต้าพื้นที่เปล่า ๆ (เคยค้างไว้ 213 MB)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SEMVER }}
          name: ${{ env.SEMVER }}
          files: "*.apk"
          make_latest: true
          body: |
            ## TPIX Wallet v${{ env.SEMVER }} (build ${{ env.NEW_VERSION }})

            ### 📱 TPIX Wallet
            - 🔐 Multi-wallet support (up to 128 wallets)
            - 📷 QR code scanner for sending
            - 📋 Transaction history with blockchain scan
            - ⚡ Zero gas fee transactions on TPIX Chain
            - 🎨 Beautiful animated UI with sound effects
            - 📱 Create/import wallet with BIP-39 seed phrase
            - 💸 Send/receive TPIX instantly
            - 🔒 PIN protection with encrypted storage
            - 🌐 Thai + English language support
            - 🌓 Light / Dark theme

            ### 🖥️ Master Node
            - HD Wallet with BIP-39/BIP-44 derivation
            - Living Identity protection system
            - Multi-wallet management (128 slots)
            - QR code scanning for addresses
            - Auto-update via electron-updater

            **Developer:** Xman Studio
            **Website:** https://tpix.online

      # electron-updater ของ Master Node อ่าน "latest release" ของ repo เสมอ
      # ถ้า release ล่าสุดเป็นของ wallet อย่างเดียว → ไม่มี latest.yml → แอปเด้ง 404
      # จึงต้องพา artifact อัปเดตของ Master Node ตัวล่าสุดตามมาทุก release
      - name: Carry forward Master Node update assets
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_TAG="v${SEMVER}"

          # หา release ล่าสุด (ไม่นับตัวที่เพิ่งสร้าง) ที่มี latest.yml ของ Master Node
          SRC_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq \
            "[ .[]
               | select(.draft == false and .prerelease == false)
               | select(.tag_name != \"${NEW_TAG}\")
               | select([.assets[].name] | index(\"latest.yml\"))
               | .tag_name ][0] // empty")

          if [ -z "$SRC_TAG" ]; then
            echo "ไม่พบ release ของ Master Node ที่มี latest.yml — ข้ามขั้นตอนนี้"
            exit 0
          fi
          echo "คัดลอก artifact อัปเดต Master Node: ${SRC_TAG} -> ${NEW_TAG}"

          rm -rf mn-update && mkdir -p mn-update && cd mn-update
          gh release download "$SRC_TAG" \
            --pattern 'latest.yml' \
            --pattern 'TPIX-Master-Node-Setup-*' \
            --clobber

          # latest.yml ต้องอยู่ release เดียวกับ .exe ที่มันอ้างถึง
          # ไม่งั้น URL ที่ electron-updater ประกอบขึ้นจะชี้ผิด release แล้ว 404
          gh release upload "$NEW_TAG" latest.yml TPIX-Master-Node-Setup-* --clobber
          echo "อัปโหลดครบแล้ว — Master Node เช็คอัปเดตได้ตามปกติ"

      # บอกเว็บทันทีที่ปล่อยรุ่นวอลเล็ตเสร็จ ไม่ต้องรอแคชหมดอายุครึ่งชั่วโมง
      # แอปวอลเล็ตเลิกยิง GitHub เองแล้ว มันถามผ่าน tpix.online ซึ่งอ่านจากที่นี่อีกที
      - name: Notify tpix.online of new wallet release
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::warning::ไม่ได้ตั้ง DEPLOY_SECRET — ข้ามการแจ้งเว็บ (เว็บจะเห็นรุ่นใหม่ภายใน 30 นาที)"
            exit 0
          fi
          echo "แจ้งเว็บ: v${SEMVER}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://tpix.online/api/v1/app/notify-release?secret=${DEPLOY_SECRET}&type=wallet&tag=v${SEMVER}" \
            -H "User-Agent: GitHub-Actions" \
            -H "Accept: application/json")
          echo "เว็บตอบ: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || echo "::warning::เว็บตอบ $HTTP_CODE — ไม่ถือว่าล้มเหลว รุ่นปล่อยสำเร็จแล้ว"

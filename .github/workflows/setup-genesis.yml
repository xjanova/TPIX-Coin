name: Setup TPIX Chain Genesis

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/setup-chain.sh'
      - 'infrastructure/genesis.json'
      - '.github/workflows/setup-genesis.yml'
  workflow_dispatch:
    inputs:
      clean:
        description: Clean and regenerate all keys
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  # ⛔ ต้องตรงกับเวอร์ชันที่ production รันจริงเสมอ (infrastructure/chain/alloc.env)
  #
  # แก้ 2026-08-05 — เดิมตั้งไว้ "1.3.2" ขณะที่ production รัน 0.9.0
  # นี่คือกลไกต้นเหตุที่ทำให้ regenesis ค้างบล็อก 0 ทั้ง 8 ครั้ง (2026-05-04 → 05-07):
  #   1. CI ดาวน์โหลด binary 1.3.2
  #   2. setup-chain.sh ส่ง --ibft-validators-prefix-path ซึ่งเป็น flag ยุค 0.9.x
  #      (คอมเมนต์ที่ setup-chain.sh:166 เขียนกำกับไว้เองว่า "not --validators-prefix")
  #   3. ได้ genesis ที่ validator set ว่างเปล่าออกมาโดยไม่มี error
  #   4. step Validate ตรวจแค่ `jq empty` → ผ่าน
  #   5. step Commit auto-commit ไฟล์เสียกลับเข้า repo
  #   6. production 0.9.0 รับ genesis นั้นไป → ค้างบล็อก 0 ตลอดกาล
  #
  # หลักฐานว่าไฟล์ถูกสร้างด้วย binary 1.x: genesis.json มีฟิลด์ baseFeeEM,
  # baseFeeChangeDenom, burnContract และ fork ชื่อ londonfix / quorumcalcalignment /
  # txHashWithType ซึ่งเป็นของยุค 1.x ทั้งชุด
  #
  # ถ้าจะอัปเกรดเป็น 1.x ต้องอัปเกรด "ทั้งสองฝั่งพร้อมกัน" (CI + docker image
  # ใน alloc.env) และซ้อมใน infrastructure/lab/run-lab.sh ก่อนทุกครั้ง
  POLYGON_EDGE_VERSION: "0.9.0"

jobs:
  generate-genesis:
    name: Generate Genesis and Validator Keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zip

      # ด่านกันเวอร์ชันหลุดจากกัน — ถ้ามีคนแก้ที่เดียวแล้วลืมอีกที่ ต้องพังที่นี่
      # ไม่ใช่ไปพังตอน genesis ขึ้น production แล้วเชนไม่เดิน
      - name: Assert CI version matches production image
        run: |
          PROD_IMAGE="$(grep -E '^POLYGON_EDGE_IMAGE=' infrastructure/chain/alloc.env \
            | cut -d= -f2- | tr -d '"' | tr -d "'")"
          PROD_VER="${PROD_IMAGE##*:}"
          echo "CI version         : ${POLYGON_EDGE_VERSION}"
          echo "production image   : ${PROD_IMAGE}"
          echo "production version : ${PROD_VER}"
          if [ "${PROD_VER}" != "${POLYGON_EDGE_VERSION}" ]; then
            echo "::error::เวอร์ชันไม่ตรงกัน — CI=${POLYGON_EDGE_VERSION} แต่ production=${PROD_VER}"
            echo "genesis ที่สร้างด้วย CLI คนละ major version กับ node ที่รันจริง"
            echo "คือกลไกที่ทำให้ regenesis ค้างบล็อก 0 มา 8 ครั้ง — ดู docs/REGENESIS-RUNBOOK.md"
            exit 1
          fi

      - name: Download polygon-edge
        run: |
          echo "Downloading polygon-edge v${POLYGON_EDGE_VERSION}"
          DOWNLOAD_URL="https://github.com/0xPolygon/polygon-edge/releases/download/v${POLYGON_EDGE_VERSION}/polygon-edge_${POLYGON_EDGE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "${DOWNLOAD_URL}" -o polygon-edge.tar.gz
          tar -xzf polygon-edge.tar.gz
          chmod +x polygon-edge
          sudo mv polygon-edge /usr/local/bin/
          rm -f polygon-edge.tar.gz
          polygon-edge version

      - name: Run setup-chain.sh
        working-directory: infrastructure
        run: |
          chmod +x setup-chain.sh
          ./setup-chain.sh --clean

      - name: Validate genesis.json
        working-directory: infrastructure
        run: |
          jq empty genesis.json
          echo "Valid JSON: OK"
          echo "Chain ID:"
          jq '.params.chainID' genesis.json
          echo "Alloc accounts:"
          jq '.genesis.alloc // .alloc | keys | length' genesis.json

      # ── ด่านที่ขาดไปและทำให้ genesis พังหลุดเข้า repo (เพิ่ม 2026-08-05) ──────────
      # jq ข้างบนตรวจแค่ "เป็น JSON ที่อ่านออกไหม" — genesis ที่ validator set ว่างเปล่า
      # ผ่านทุกข้อข้างบนได้สบาย แล้วถูก auto-commit กลับเข้า repo (ดู step "Commit updated
      # genesis.json" ด้านล่าง) นั่นคือที่มาของ genesis.json ปัจจุบันที่ extraData ยาว
      # 82 ตัวอักษร = ไม่มี validator เลย → เชนค้างบล็อก 0 มา 8 ครั้ง
      #
      # genesis-verify.py ถอด RLP ของ extraData แล้วนับ validator จริง — exit 1 ถ้าว่าง
      # อย่าถอดขั้นนี้ออก ไม่ว่าจะรีบแค่ไหน
      - name: Verify IBFT validator set (บล็อกไม่ให้ genesis เสียหลุดเข้า repo)
        working-directory: infrastructure
        run: |
          python3 scripts/genesis-verify.py genesis.json \
            --validators 4 \
            --chain-id 4289 \
            --total-supply 7000000000 \
            --validator-type bls

      - name: Display validator summary
        working-directory: infrastructure
        run: |
          if [[ -f data/validators.json ]]; then
            jq -r '.validators[] | "Validator \(.id): \(.address)"' data/validators.json
            echo "Bootnodes:"
            jq -r '.bootnodes[]' data/validators.json
          fi
          echo "Key Files:"
          for i in 1 2 3 4; do
            DIR="data/validator-${i}"
            if [[ -d "${DIR}" ]]; then
              echo "  validator-${i}/:"
              ls -la "${DIR}/"
            fi
          done

      - name: Upload genesis.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpix-genesis
          path: |
            infrastructure/genesis.json
            infrastructure/data/validators.json
          retention-days: 90

      - name: Encrypt validator keys
        working-directory: infrastructure
        env:
          KEYS_PASSWORD: ${{ secrets.VALIDATOR_KEYS_PASSWORD }}
        run: |
          if [[ -z "${KEYS_PASSWORD:-}" ]]; then
            echo "::error::VALIDATOR_KEYS_PASSWORD secret is not configured. Set it in repo Settings > Secrets."
            exit 1
          fi
          zip -r -P "${KEYS_PASSWORD}" validator-keys-encrypted.zip \
            data/validator-1/ \
            data/validator-2/ \
            data/validator-3/ \
            data/validator-4/ \
            data/validators.json
          echo "Encrypted archive created"

      - name: Upload encrypted validator keys
        uses: actions/upload-artifact@v4
        with:
          name: tpix-validator-keys-encrypted
          path: infrastructure/validator-keys-encrypted.zip
          retention-days: 30

      - name: Commit updated genesis.json
        working-directory: infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -f data/validators.json ]]; then
            mkdir -p config
            cp data/validators.json config/validators.json
            git add config/validators.json
          fi
          git add genesis.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(infra): auto-generate genesis.json with IBFT2 validators [skip ci]"
            git push
          fi

      - name: Job summary
        working-directory: infrastructure
        run: |
          echo "## TPIX Chain Genesis Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chain ID | 4289 |" >> $GITHUB_STEP_SUMMARY
          echo "| Consensus | IBFT 2.0 (PoA) |" >> $GITHUB_STEP_SUMMARY
          echo "| Block Time | 2s |" >> $GITHUB_STEP_SUMMARY
          echo "| Gas Price | 0 (free) |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Supply | 7B TPIX |" >> $GITHUB_STEP_SUMMARY
          echo "| Validators | 4 |" >> $GITHUB_STEP_SUMMARY
          if [[ -f data/validators.json ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Validators" >> $GITHUB_STEP_SUMMARY
            jq -r '.validators[] | "- \(.id): \(.address)"' data/validators.json >> $GITHUB_STEP_SUMMARY
          fi
